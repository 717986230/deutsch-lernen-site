<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><defs><linearGradient id="slash" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fdf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#f9a8d4"/><stop offset="1" stop-color="#ffffff"/></linearGradient><filter id="g1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.spin{transform-origin:60px 60px;animation:spin var(--d,10s) linear infinite}
.rspin{transform-origin:60px 60px;animation:spin var(--d,14s) linear infinite reverse}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.flk{transform-box:fill-box;transform-origin:50% 100%;animation:flk .9s ease-in-out infinite alternate}
.pulse{transform-origin:60px 60px;animation:pulse 2.4s ease-in-out infinite}
.wave{transform-origin:60px 60px;animation:wave 2.4s ease-out infinite}
.rise{transform-box:fill-box;animation:rise 2.4s ease-in infinite}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes flk{0%{transform:scaleY(.82) skewX(-3deg)}100%{transform:scaleY(1.12) skewX(3deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes wave{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.22);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes blink{0%,100%{opacity:0}8%,14%{opacity:1}20%{opacity:0}52%,56%{opacity:1}60%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.fall{transform-box:fill-box;animation:fall 3.6s linear infinite}@keyframes fall{0%{opacity:0;translate:0 -6px}15%{opacity:1}100%{opacity:0;translate:6px 14px}}</style></defs><circle cx="60" cy="60" r="44" fill="none" stroke="#1f2937" stroke-width="4"/><circle cx="60" cy="60" r="44" fill="none" stroke="#fbcfe8" stroke-width="1"/><g class="spin" style="--d:3.2s"><path d="M60 12A48 48 0 0 1 101.57 84" fill="none" stroke="url(#slash)" stroke-width="3.2" stroke-linecap="round" filter="url(#g1)"/><path d="M60 108A48 48 0 0 1 18.43 36" fill="none" stroke="url(#slash)" stroke-width="3.2" stroke-linecap="round" filter="url(#g1)"/></g><g transform="rotate(-40 60 60)"><path d="M10 60H24" stroke="#78350f" stroke-width="3.4" stroke-linecap="round"/><rect x="23" y="56" width="2.4" height="8" rx=".8" fill="#fbbf24"/><path d="M25.4 58.6H44Q47 60 44 61.4H25.4Z" fill="#e5e7eb" stroke="#9ca3af" stroke-width=".5"/></g><path class="fall" style="animation-delay:0s" transform="translate(68.68 10.76) rotate(0) scale(0.75)" fill="#f9a8d4" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/><path class="fall" style="animation-delay:0.45s" transform="translate(100.6 25.93) rotate(47) scale(0.87)" fill="#fbcfe8" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/><path class="fall" style="animation-delay:0.9s" transform="translate(116 60) rotate(94) scale(0.99)" fill="#f9a8d4" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/><path class="fall" style="animation-delay:1.35s" transform="translate(98.3 92.14) rotate(141) scale(0.75)" fill="#fbcfe8" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/><path class="fall" style="animation-delay:1.8s" transform="translate(69.2 112.19) rotate(188) scale(0.87)" fill="#f9a8d4" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/><path class="fall" style="animation-delay:2.25s" transform="translate(32 108.5) rotate(235) scale(0.99)" fill="#fbcfe8" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/><path class="fall" style="animation-delay:2.7s" transform="translate(13.02 77.1) rotate(282) scale(0.75)" fill="#f9a8d4" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/><path class="fall" style="animation-delay:3.15s" transform="translate(10.2 41.87) rotate(329) scale(0.87)" fill="#fbcfe8" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/><path class="fall" style="animation-delay:3.6s" transform="translate(32 11.5) rotate(376) scale(0.99)" fill="#f9a8d4" d="M0 -6C3.5 -6 5 -2 3.6 2C2.6 4.6 1 6 0 6.6C-1 6 -2.6 4.6 -3.6 2C-5 -2 -3.5 -6 0 -6ZM0 -6L-1 -4.2L0 -3.6L1 -4.2Z"/></svg>
