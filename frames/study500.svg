<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#fecaca"/><stop offset="0.33" stop-color="#ef4444"/><stop offset="0.67" stop-color="#7f1d1d"/><stop offset="1.00" stop-color="#ef4444"/></linearGradient><linearGradient id="aura" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#ffffff"/><stop offset="0.50" stop-color="#fca5a5"/><stop offset="1.00" stop-color="#dc2626"/></linearGradient><filter id="g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.spin{transform-origin:60px 60px;animation:spin var(--d,10s) linear infinite}
.rspin{transform-origin:60px 60px;animation:spin var(--d,14s) linear infinite reverse}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.flk{transform-box:fill-box;transform-origin:50% 100%;animation:flk .9s ease-in-out infinite alternate}
.pulse{transform-origin:60px 60px;animation:pulse 2.4s ease-in-out infinite}
.wave{transform-origin:60px 60px;animation:wave 2.4s ease-out infinite}
.rise{transform-box:fill-box;animation:rise 2.4s ease-in infinite}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes flk{0%{transform:scaleY(.82) skewX(-3deg)}100%{transform:scaleY(1.12) skewX(3deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes wave{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.22);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes blink{0%,100%{opacity:0}8%,14%{opacity:1}20%{opacity:0}52%,56%{opacity:1}60%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><circle class="wave" cx="60" cy="60" r="44" fill="none" stroke="#ef4444" stroke-width="3"/><circle class="wave" style="animation-delay:1.2s" cx="60" cy="60" r="44" fill="none" stroke="#fb7185" stroke-width="3"/><g filter="url(#g2)"><path class="flk" style="animation-delay:0s" transform="translate(60 16) rotate(0)" d="M-3 0Q-2 -5.6 0 -8Q2 -5.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.07s" transform="translate(75.05 18.65) rotate(20)" d="M-3 0Q-2 -9.1 0 -13Q2 -9.1 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.14s" transform="translate(88.28 26.29) rotate(40)" d="M-3 0Q-2 -12.6 0 -18Q2 -12.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.21s" transform="translate(98.11 38) rotate(60)" d="M-3 0Q-2 -5.6 0 -8Q2 -5.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.28s" transform="translate(103.33 52.36) rotate(80)" d="M-3 0Q-2 -9.1 0 -13Q2 -9.1 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.35s" transform="translate(103.33 67.64) rotate(100)" d="M-3 0Q-2 -12.6 0 -18Q2 -12.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.42s" transform="translate(98.11 82) rotate(120)" d="M-3 0Q-2 -5.6 0 -8Q2 -5.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.49s" transform="translate(88.28 93.71) rotate(140)" d="M-3 0Q-2 -9.1 0 -13Q2 -9.1 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.56s" transform="translate(75.05 101.35) rotate(160)" d="M-3 0Q-2 -12.6 0 -18Q2 -12.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.63s" transform="translate(60 104) rotate(180)" d="M-3 0Q-2 -5.6 0 -8Q2 -5.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.7s" transform="translate(44.95 101.35) rotate(200)" d="M-3 0Q-2 -9.1 0 -13Q2 -9.1 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.77s" transform="translate(31.72 93.71) rotate(220)" d="M-3 0Q-2 -12.6 0 -18Q2 -12.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.84s" transform="translate(21.89 82) rotate(240)" d="M-3 0Q-2 -5.6 0 -8Q2 -5.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.91s" transform="translate(16.67 67.64) rotate(260)" d="M-3 0Q-2 -9.1 0 -13Q2 -9.1 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:0.98s" transform="translate(16.67 52.36) rotate(280)" d="M-3 0Q-2 -12.6 0 -18Q2 -12.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:1.05s" transform="translate(21.89 38) rotate(300)" d="M-3 0Q-2 -5.6 0 -8Q2 -5.6 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:1.12s" transform="translate(31.72 26.29) rotate(320)" d="M-3 0Q-2 -9.1 0 -13Q2 -9.1 3 0Z" fill="url(#aura)"/><path class="flk" style="animation-delay:1.19s" transform="translate(44.95 18.65) rotate(340)" d="M-3 0Q-2 -12.6 0 -18Q2 -12.6 3 0Z" fill="url(#aura)"/></g><circle cx="60" cy="60" r="42.5" fill="none" stroke="url(#rg)" stroke-width="3.5"/></svg>
