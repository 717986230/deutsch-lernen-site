<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#fdba74"/><stop offset="0.33" stop-color="#fef08a"/><stop offset="0.67" stop-color="#f9a8d4"/><stop offset="1.00" stop-color="#fdba74"/></linearGradient><linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#fde047"/><stop offset="1.00" stop-color="#fb923c"/></linearGradient><radialGradient id="sun"><stop offset="0" stop-color="#fffbeb"/><stop offset=".6" stop-color="#fde047"/><stop offset="1" stop-color="#fb923c"/></radialGradient><filter id="g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.spin{transform-origin:60px 60px;animation:spin var(--d,10s) linear infinite}
.rspin{transform-origin:60px 60px;animation:spin var(--d,14s) linear infinite reverse}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.flk{transform-box:fill-box;transform-origin:50% 100%;animation:flk .9s ease-in-out infinite alternate}
.pulse{transform-origin:60px 60px;animation:pulse 2.4s ease-in-out infinite}
.wave{transform-origin:60px 60px;animation:wave 2.4s ease-out infinite}
.rise{transform-box:fill-box;animation:rise 2.4s ease-in infinite}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes flk{0%{transform:scaleY(.82) skewX(-3deg)}100%{transform:scaleY(1.12) skewX(3deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes wave{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.22);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes blink{0%,100%{opacity:0}8%,14%{opacity:1}20%{opacity:0}52%,56%{opacity:1}60%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><g class="pulse"><path d="M60 14L60 0" stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round"/><path d="M77.6 17.5L81.43 8.26" stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round"/><path d="M92.53 27.47L102.43 17.57" stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round"/><path d="M102.5 42.4L111.74 38.57" stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round"/><path d="M106 60L120 60" stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round"/><path d="M102.5 77.6L111.74 81.43" stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round"/><path d="M92.53 92.53L102.43 102.43" stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round"/><path d="M77.6 102.5L81.43 111.74" stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round"/><path d="M60 106L60 120" stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round"/><path d="M42.4 102.5L38.57 111.74" stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round"/><path d="M27.47 92.53L17.57 102.43" stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round"/><path d="M17.5 77.6L8.26 81.43" stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round"/><path d="M14 60L0 60" stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round"/><path d="M17.5 42.4L8.26 38.57" stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round"/><path d="M27.47 27.47L17.57 17.57" stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round"/><path d="M42.4 17.5L38.57 8.26" stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round"/></g><circle cx="60" cy="60" r="44" fill="none" stroke="url(#sg)" stroke-width="5"/><circle cx="60" cy="60" r="46.8" fill="none" stroke="#fff7ed" stroke-width=".8"/><g filter="url(#g2)"><circle cx="60" cy="13" r="9" fill="url(#sun)"/></g><g class="bob"><path d="M8 100C8 92 18 90 22 94C24 86 36 86 38 94C44 92 50 98 46 104H10C6 104 6 100 8 100Z" fill="#fff" stroke="#fed7aa" stroke-width=".8"/></g><g class="bob" style="animation-delay:1.3s"><path d="M78 104C76 96 86 94 90 98C92 90 104 90 106 98C112 96 116 102 112 108H82C78 108 76 104 78 104Z" fill="#fff" stroke="#fbcfe8" stroke-width=".8"/></g><g class="bob" style="animation-delay:.6s"><path d="M88 30q3 -3 6 0q3 -3 6 0" fill="none" stroke="#9a3412" stroke-width="1.1" stroke-linecap="round"/><path d="M96 40q2 -2 4 0q2 -2 4 0" fill="none" stroke="#9a3412" stroke-width=".9" stroke-linecap="round"/></g></svg>
