ill="#ef4444"/><path class="flk" d="M-6 -1.5L-12 0L-6 1.5Z" fill="#f97316"/></g></g><circle cx="100" cy="98" r="7" fill="url(#pl)"/><ellipse cx="100" cy="98" rx="11" ry="2.6" fill="none" stroke="#fcd34d" stroke-width="1.2" transform="rotate(-20 100 98)"/></svg>
