<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#78350f"/><stop offset="0.33" stop-color="#fbbf24"/><stop offset="0.67" stop-color="#7c2d12"/><stop offset="1.00" stop-color="#fcd34d"/></linearGradient><filter id="g1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.spin{transform-origin:60px 60px;animation:spin var(--d,10s) linear infinite}
.rspin{transform-origin:60px 60px;animation:spin var(--d,14s) linear infinite reverse}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.flk{transform-box:fill-box;transform-origin:50% 100%;animation:flk .9s ease-in-out infinite alternate}
.pulse{transform-origin:60px 60px;animation:pulse 2.4s ease-in-out infinite}
.wave{transform-origin:60px 60px;animation:wave 2.4s ease-out infinite}
.rise{transform-box:fill-box;animation:rise 2.4s ease-in infinite}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes flk{0%{transform:scaleY(.82) skewX(-3deg)}100%{transform:scaleY(1.12) skewX(3deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes wave{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.22);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes blink{0%,100%{opacity:0}8%,14%{opacity:1}20%{opacity:0}52%,56%{opacity:1}60%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.flip{transform-origin:60.5px 100px;animation:flip 3s ease-in-out infinite}@keyframes flip{0%,60%{transform:scaleX(1)}80%{transform:scaleX(-1)}100%{transform:scaleX(-1);opacity:0}}</style></defs><circle cx="60" cy="60" r="44" fill="none" stroke="url(#gb)" stroke-width="4"/><g class="spin" style="--d:16s"><text x="60" y="11" transform="rotate(0 60 8)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)">Ä</text><text x="90.56" y="20.93" transform="rotate(36 90.56 17.93)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)">Ö</text><text x="109.45" y="46.93" transform="rotate(72 109.45 43.93)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)">Ü</text><text x="109.45" y="79.07" transform="rotate(108 109.45 76.07)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)">ß</text><text x="90.56" y="105.07" transform="rotate(144 90.56 102.07)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)">A</text><text x="60" y="115" transform="rotate(180 60 112)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)">E</text><text x="29.44" y="105.07" transform="rotate(216 29.44 102.07)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)">I</text><text x="10.55" y="79.07" transform="rotate(252 10.55 76.07)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)">O</text><text x="10.55" y="46.93" transform="rotate(288 10.55 43.93)" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#fcd34d" text-anchor="middle" filter="url(#g1)