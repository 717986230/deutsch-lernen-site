<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.spin{transform-origin:60px 60px;animation:spin var(--d,10s) linear infinite}
.rspin{transform-origin:60px 60px;animation:spin var(--d,14s) linear infinite reverse}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.flk{transform-box:fill-box;transform-origin:50% 100%;animation:flk .9s ease-in-out infinite alternate}
.pulse{transform-origin:60px 60px;animation:pulse 2.4s ease-in-out infinite}
.wave{transform-origin:60px 60px;animation:wave 2.4s ease-out infinite}
.rise{transform-box:fill-box;animation:rise 2.4s ease-in infinite}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes flk{0%{transform:scaleY(.82) skewX(-3deg)}100%{transform:scaleY(1.12) skewX(3deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes wave{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.22);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes blink{0%,100%{opacity:0}8%,14%{opacity:1}20%{opacity:0}52%,56%{opacity:1}60%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><circle class="" cx="60" cy="60" r="45" fill="none" stroke="#f5e6c8" stroke-width="7" /><g class="spin" style="--d:20s"><circle class="" cx="60" cy="60" r="45" fill="none" stroke="#8b5e34" stroke-width="1.6" stroke-dasharray="4 3"/></g><text class="bob" style="animation-delay:0s" x="21.11" y="21.11" font-family="Georgia,serif" font-size="9" font-weight="700" fill="#8b5e34" text-anchor="middle">A</text><text class="bob" style="animation-delay:0.5s" x="98.89" y="21.11" font-family="Georgia,serif" font-size="9" font-weight="700" fill="#8b5e34" text-anchor="middle">ä</text><text class="bob" style="animation-delay:1s" x="98.89" y="98.89" font-family="Georgia,serif" font-size="9" font-weight="700" fill="#8b5e34" text-anchor="middle">ß</text><text class="bob" style="animation-delay:1.5s" x="21.11" y="98.89" font-family="Georgia,serif" font-size="9" font-weight="700" fill="#8b5e34" text-anchor="middle">Ö</text><path d="M42 100Q51 95 60 101Q69 95 78 100L78 113Q69 108 60 114Q51 108 42 113Z" fill="#fffaf0" stroke="#8b5e34" stroke-width="1.2"/><line x1="60" y1="101" x2="60" y2="114" stroke="#8b5e34" stroke-width="1"/></svg>
