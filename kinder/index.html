":"弗罗施 格吕恩","a":"01682b655f.mp3"},{"de":"kirschrot","zh":"樱桃红","py":"基尔施 罗特","a":"558c797e00.mp3"},{"de":"zitronengelb","zh":"柠檬黄","py":"齐特罗嫩 格尔普","a":"6347a3712f.mp3"},{"de":"goldbraun","zh":"金棕","py":"戈尔特 布劳恩","a":"652a3382cf.mp3"},{"de":"kastanienbraun","zh":"栗子棕","py":"卡斯塔尼恩 布劳恩","a":"8a4a26e90f.mp3"},{"de":"schneeweiß","zh":"雪白","py":"施内 魏斯","a":"2394dc57de.mp3"},{"de":"mausgrau","zh":"鼠灰","py":"毛斯 格劳","a":"b570b9fc4a.mp3"},{"de":"rabenschwarz","zh":"乌黑（渡鸦黑）","py":"拉本 施瓦尔茨","a":"e54e76eb54.mp3"},{"de":"flamingorosa","zh":"火烈鸟粉","py":"弗拉明戈 罗萨","a":"3924c90f74.mp3"},{"de":"veilchenlila","zh":"紫罗兰紫","py":"法伊尔欣 利拉","a":"282460abc8.mp3"},{"de":"fuchsorange","zh":"狐狸橙","py":"富克斯 奥朗舍","a":"a2dd47cdfe.mp3"}],"grammar":[{"t":"颜色怎么「变」：aus … wird …","zh":"「用 A 和 B 变出 C」德语说 Aus A und B wird C。wird 是「变成」。","ex":[{"de":"Aus Rot und Gelb wird Orange.","zh":"红加黄变成橙。","py":"奥斯 罗特 翁特 格尔普 维尔特 奥朗舍。","a":"62ab4a049e.mp3"},{"de":"Aus Blau und Gelb wird Grün.","zh":"蓝加黄变成绿。","py":"奥斯 布劳 翁特 格尔普 维尔特 格吕恩。","a":"eb93fa9837.mp3"}]},{"t":"可分动词 anmalen（涂色）","zh":"anmalen 用在句子里要拆开：malen 放第二位，an 跑到句子最后。","ex":[{"de":"Ich male den Apfel rot an.","zh":"我把苹果涂成红色。","py":"伊希 马勒 登 阿普菲尔 罗特 安。","a":"10d55cd013.mp3"},{"de":"Wir malen die Wand bunt an.","zh":"我们把墙涂得五颜六色。","py":"维尔 马伦 迪 万特 布恩特 安。","a":"21adf00842.mp3"}]},{"t":"组合颜色词：东西 + 颜色","zh":"德语喜欢把「像什么」直接拼在颜色前面，写成一个词：Zitrone（柠檬）+ gelb → zitronengelb（柠檬黄）。hell- 表示浅，dunkel- 表示深。","ex":[{"de":"Der Himmel ist himmelblau.","zh":"天空是天蓝色的。","py":"戴尔 希梅尔 伊斯特 希梅尔 布劳。","a":"807cf12628.mp3"},{"de":"Der Frosch ist froschgrün.","zh":"青蛙是青蛙绿。","py":"戴尔 弗罗施 伊斯特 弗罗施 格吕恩。","a":"a1f7542128.mp3"}]},{"t":"wenn（如果）和 weil（因为）","zh":"wenn 和 weil 后面的小句，动词要放到最后。","ex":[{"de":"Wenn ich Rot und Blau mische, bekomme ich Lila.","zh":"如果我把红和蓝混在一起，就得到紫色。","py":"文 伊希 罗特 翁特 布劳 米舍，贝科默 伊希 利拉。","a":"4166e85254.mp3"},{"de":"Das Monster ist rot, weil es Kirschen isst.","zh":"怪兽是红色的，因为它吃樱桃。","py":"达斯 蒙斯特尔 伊斯特 罗特，魏尔 埃斯 基尔申 伊斯特。","a":"8ccf524fd0.mp3"}]}],"notes":["Ilwa 伊尔瓦：故事主角，头发是紫色的，有一只能变魔术的袜子（Zaubersocke）。","Kunterbunt：五颜六色，这里是幼儿园小组的名字。"]}},{"id":"feste","de":"Fest","zh":"节日聚会","icon":"🎉","bg":["#fff0d6","#ffe0f0"],"guide":{"teil":2,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-2-fest/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-2-Fest.pdf","story":"Konfetti überall","storyZh":"到处都是彩色纸屑","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["下雨天，Levi 没法继续在外面堆沙堡，很失望。伊尔瓦说：人在哪儿都可以开心——我们来办一个「开心派对」吧！","老师 Gernot 敲响颂钵把孩子们叫过来。大家七嘴八舌提建议：吃什么、放什么音乐、怎么装饰、演什么戏、要什么甜点。老师分好小组，定在一周后办。","准备的时候，手工角挂满了彩带和花环，有个孩子从家里带来了音乐 CD。戏剧组里两个孩子抢国王的王冠吵了起来，另一个孩子想了个好办法：演两个王国——光明王国和影子王国，这样就有两个国王了。","派对那天，伊尔瓦早早就来了。大家一起做抹酱面包，伊尔瓦在上面放了红辣椒。桌上摆好杯子、苹果汁、水和气球。","别的班的孩子也来了。大家跳舞、唱歌、吃点心，然后戏剧组上台表演。一个本来很害羞的小女孩演了月亮和太阳，伊尔瓦为她加油。","最后伊尔瓦挥挥魔法袜子，变成一台紫色的彩纸机，彩纸屑撒了大家一身。"],"vocab":[{"de":"feiern","zh":"庆祝","py":"法伊恩","a":"152cfbee1f.mp3"},{"de":"planen","zh":"计划","py":"普拉嫩","a":"5fd363f34a.mp3"},{"de":"schmücken","zh":"装饰","py":"施米肯","a":"04a1bffa4c.mp3"},{"de":"wählen","zh":"选","py":"韦伦","a":"d12e3a84b8.mp3"},{"de":"sich entscheiden","zh":"做决定","py":"齐希 恩特沙伊登","a":"2ee880fb73.mp3"},{"de":"mitbringen","zh":"带来","py":"米特 布林根","a":"4d864217a9.mp3"},{"de":"möchten","zh":"想要","py":"默希滕","a":"62cf1e11cb.mp3"},{"de":"wollen","zh":"要（想做）","py":"沃伦","a":"1bb77711f0.mp3"},{"de":"sollen","zh":"应该","py":"佐伦","a":"0d38b78606.mp3"},{"de":"das Getränk","zh":"饮料","py":"达斯 格特伦克","a":"0e6d6ff6d7.mp3"},{"de":"der Apfelsaft","zh":"苹果汁","py":"戴尔 阿普菲尔 扎夫特","a":"cb828a872b.mp3"},{"de":"die Würstel","zh":"小香肠（奥地利说法）","py":"迪 维尔斯特尔","a":"ecdba41380.mp3"},{"de":"der Krapfen","zh":"甜甜圈（奥地利说法）","py":"戴尔 克拉普芬","a":"cc7be85744.mp3"},{"de":"der Kuchen","zh":"蛋糕","py":"戴尔 库亨","a":"5a6c583fc1.mp3"},{"de":"die Girlande","zh":"花环彩带","py":"迪 吉尔兰德","a":"6f12b04353.mp3"},{"de":"die Papierschlange","zh":"纸彩带","py":"迪 帕皮尔 施朗厄","a":"bf23570f91.mp3"},{"de":"das Konfetti","zh":"彩纸屑","py":"达斯 孔费蒂","a":"0c4c96c520.mp3"},{"de":"der Luftballon","zh":"气球","py":"戴尔 卢夫特 巴隆","a":"01e6a77cca.mp3"},{"de":"die Musik","zh":"音乐","py":"迪 穆齐克","a":"07071e7896.mp3"},{"de":"das Kasperltheater","zh":"木偶戏（奥地利）","py":"达斯 卡斯佩尔 特阿特尔","a":"5a17132c6d.mp3"}],"grammar":[{"t":"想要：möchten / wollen","zh":"möchten 是客气的「想要」，wollen 更直接。后面接名词，或者接动词原形放句尾。","ex":[{"de":"Was möchtest du für unser Fest?","zh":"你想为我们的派对准备什么？","py":"瓦斯 默希特斯特 杜 菲尔 翁泽尔 费斯特？","a":"8f8e94fec5.mp3"},{"de":"Ich will tanzen.","zh":"我想跳舞。","py":"伊希 维尔 坦岑。","a":"9fa7993c89.mp3"}]},{"t":"可分动词 mitbringen（带来）","zh":"句子里拆开：bringe 放第二位，mit 放最后。","ex":[{"de":"Ich bringe Eis mit!","zh":"我带冰淇淋来！","py":"伊希 布林厄 艾斯 米特！","a":"f23dd467f4.mp3"},{"de":"Wer bringt die Musik mit?","zh":"谁带音乐来？","py":"维尔 布林特 迪 穆齐克 米特？","a":"fbc5cabcf8.mp3"}]},{"t":"应该：sollen","zh":"sollen 表示「应该、被安排去做」，动词原形放句尾。","ex":[{"de":"Wir sollen den Raum schmücken.","zh":"我们负责装饰房间。","py":"维尔 佐伦 登 劳姆 施米肯。","a":"7d994755fe.mp3"}]},{"t":"问话的词：wer / was / wie","zh":"wer＝谁，was＝什么，wie＝怎么样。问句里动词排第二。","ex":[{"de":"Wer hilft mir?","zh":"谁来帮我？","py":"维尔 希尔夫特 米尔？","a":"8a7afdcbfe.mp3"}]}],"notes":["奥地利说法：小香肠叫 Würstel，甜甜圈叫 Krapfen，棒棒糖叫 Schlecker。","Immerfroh＝「永远开心」，也是伊尔瓦的姓。"]}},{"id":"gruppenraum","de":"Gruppenraum","zh":"幼儿园教室","icon":"🧸","bg":["#fff4d9","#e3f1ff"],"guide":{"teil":3,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-3-gruppenraum/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-3-Gruppenraum.pdf","story":"Morgenkonzert im Kindergarten","storyZh":"幼儿园的早晨音乐会","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["一大早，伊尔瓦把自己变成一把吉他，待在幼儿园音乐角的木琴旁边。孩子们陆陆续续来了，老师 Bea 在给两个孩子读恐龙绘本，还有个孩子在休息区的垫子上犯困。","一位妈妈带着女儿 Nina 来了，今天是 Nina 第一天上幼儿园。老师热情地叫她的名字打招呼，Nina 害羞地把脸埋进妈妈的外套里。","老师带 Nina 参观教室：手工区（彩笔、印章）、搭建区（有个男孩在重新搭一座摇摇晃晃的塔）、自然科学区。妈妈坐在角色扮演角的椅子上鼓励她。","Nina 在白纸上试着盖印章，可还是一直回头看妈妈。伊尔瓦看到了，决定给她编一首欢迎歌。","Nina 发现了音乐角的木琴，说家里也有一个。老师递给她两根小琴槌，她敲出一段好听的旋律。","越来越多孩子围过来听，有的拿起别的乐器一起演奏，变成了一场早晨音乐会。Nina 脸红红地跟妈妈说：明天我还想来！"],"vocab":[{"de":"der Gruppenraum","zh":"（幼儿园）班级活动室","py":"戴尔 格鲁彭 劳姆","a":"422ed9ec83.mp3"},{"de":"d el","zh":"多","py":"菲尔","a":"ea0c662de5.mp3"},{"de":"wenig","zh":"少","py":"维尼希","a":"9a1ca28b99.mp3"},{"de":"gleich viel","zh":"一样多","py":"格莱希 菲尔","a":"6eba4dd79d.mp3"},{"de":"ein paar","zh":"几个","py":"艾因 帕尔","a":"fe039ee516.mp3"},{"de":"alle","zh":"所有人／全部","py":"阿勒","a":"ac78aefc17.mp3"},{"de":"kein","zh":"没有","py":"凯因","a":"a4dfa6896b.mp3"},{"de":"zusammen","zh":"一共／一起","py":"楚扎门","a":"c341d8c38e.mp3"},{"de":"wie viele","zh":"多少个","py":"维 菲勒","a":"153f15e57c.mp3"},{"de":"mehr","zh":"更多","py":"梅尔","a":"1960ac5a2d.mp3"},{"de":"weniger","zh":"更少","py":"维尼格尔","a":"15353354d9.mp3"},{"de":"am meisten","zh":"最多","py":"阿姆 迈斯滕","a":"93c6a6b6dd.mp3"},{"de":"zählen","zh":"数","py":"采伦","a":"8b0628ed73.mp3"},{"de":"teilen","zh":"分享／分","py":"泰伦","a":"a8b016dd0c.mp3"},{"de":"nehmen","zh":"拿","py":"内门","a":"44bfde47a7.mp3"},{"de":"geben","zh":"给","py":"格本","a":"2d37761f7b.mp3"},{"de":"schenken","zh":"送（礼物）","py":"申肯","a":"27221e7cb1.mp3"},{"de":"fehlen","zh":"缺少","py":"费伦","a":"5f507657a1.mp3"},{"de":"das Blatt","zh":"树叶","py":"达斯 布拉特","a":"556edb699a.mp3"},{"de":"die Kastanie","zh":"栗子","py":"迪 卡斯塔尼耶","a":"f3e0408388.mp3"},{"de":"die Murmel","zh":"弹珠","py":"迪 穆尔梅尔","a":"9a551c4848.mp3"},{"de":"der Stein","zh":"石头","py":"戴尔 施泰因","a":"3dd0556917.mp3"}],"grammar":[{"t":"问「多少个」：Wie viele …?","zh":"wie viele 后面接复数名词。回答直接说数字 + 名词。","ex":[{"de":"Wie viele Kastanien hast du?","zh":"你有几个栗子？","py":"维 菲勒 卡斯塔尼恩 哈斯特 杜？","a":"e0ac604008.mp3"},{"de":"Ich habe sieben Kastanien.","zh":"我有七个栗子。","py":"伊希 哈贝 齐本 卡斯塔尼恩。","a":"46ab346e8b.mp3"}]},{"t":"比多少：mehr / weniger als","zh":"mehr als = 比……多，weniger als = 比……少。奥地利人常加一个 um：um eins weniger（少一个）。","ex":[{"de":"Du hast mehr als ich.","zh":"你的比我多。","py":"杜 哈斯特 梅尔 阿尔斯 伊希。","a":"be1a8e2c8d.mp3"},{"de":"Ich habe um ein Blatt weniger als du.","zh":"我比你少一片叶子。","py":"伊希 哈贝 乌姆 艾因 布拉特 维尼格尔 阿尔斯 杜。","a":"0e59042109.mp3"}]},{"t":"最多：am meisten","zh":"viel（多）→ mehr（更多）→ am meisten（最多）。","ex":[{"de":"Ich habe am meisten gesammelt!","zh":"我捡得最多！","py":"伊希 哈贝 阿姆 迈斯滕 格扎梅尔特！","a":"9d4645e105.mp3"}]},{"t":"缺几个：mir fehlen …","zh":"fehlen 的意思是「缺」，缺的东西做主语，「我」用 mir。","ex":[{"de":"Mir fehlen drei Steine.","zh":"我还缺三块石头。","py":"米尔 费伦 德赖 施泰讷。","a":"04b3164c2d.mp3"},{"de":"Teilen macht Spaß!","zh":"分享真开心！","py":"泰伦 马赫特 施帕斯！","a":"d80ab72588.mp3"}]}],"notes":["一个变多个要用复数：ein Blatt → zwei Blätter，eine Kastanie → zwei Kastanien，ein Stein → zwei Steine。"]}},{"id":"museum","de":"Museum","zh":"博物馆","icon":"🦖","bg":["#f1ead9","#e3ecff"],"guide":{"teil":5,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-5-museum/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-5-Museum.pdf","story":"Museumsluft und Ausstellungsduft","storyZh":"博物馆的味道","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["下雨天，伊尔瓦在城市图书馆。一个叫 Tanja 的女孩跟着舅舅离开，因为舅舅答应带她去博物馆。","伊尔瓦问图书管理员博物馆是什么。管理员说：每个博物馆收藏不同的东西，有的放邮票，有的放老飞机，有的放稀有植物。城里有好多博物馆。","伊尔瓦有了个主意：从各个博物馆借东西来，在图书馆大厅办一个自己的展览！","接下来几个星期，她跑遍各个博物馆去借：红色的小丑鞋、巨大的巧克力复活节兔子、一副吓了她一跳的恐龙骨架，还有很多滴答响的钟。","展览那天，大厅里摆满了展台和玻璃柜，还有金色的画、童话舞会的服装、蝴蝶书和模型火车。","参观的时候，一个男孩把瓷娃娃碰掉了。伊尔瓦用魔法袜子把一个靠垫变到下面接住，娃娃没摔坏。管理员赶紧放了块牌子：「请勿触摸！易碎！」","Tanja 和舅舅也来了，她说想多了解恐龙，舅舅答应很快带她去恐龙博物馆。"],"vocab":[{"de":"das Museum","zh":"博物馆","py":"达斯 穆泽乌姆","a":"12c9cd8127.mp3"},{"de":"die Ausstellung","zh":"展览","py":"迪 奥斯 施特隆","a":"03900ce89e.mp3"},{"de":"die Vitrine","zh":"玻璃展柜","py":"迪 维特里讷","a":"9c0590a489.mp3"},{"de":"das Gemälde","zh":"油画","py":"达斯 格梅尔德","a":"914c3a21fc.mp3"},{"de":"die Zeichnung","zh":"素描、画","py":"迪 灿希农","a":"d823c6225a.mp3"},{"de":"die Fotografie","zh":"照片","py":"迪 福托格拉菲","a":"9e67a0c182.mp3"},{"de":"der Bilderrahmen","zh":"画框","py":"戴尔 比尔德尔 拉门","a":"ffc6441830.mp3"},{"de":"das Dinosauriermuseum","zh":"恐龙博物馆","py":"达斯 迪诺扎乌里尔 穆泽乌姆","a":"8b4f37664a.mp3"},{"de":"das Spielzeugmuseum","zh":"玩具博物馆","py":"达斯 施皮尔措伊克 穆泽乌姆","a":"f2022b3642.mp3"},{"de":"das Kunstmuseum","zh":"美术馆","py":"达斯 昆斯特 穆泽乌姆","a":"d46a874701.mp3"},{"de":"die Briefmarke","zh":"邮票","py":"迪 布里夫 马尔克","a":"0507bc0905.mp3"},{"de":"besuchen","zh":"参观","py":"贝祖亨","a":"c4b843d000.mp3"},{"de":"ausstellen","zh":"展出","py":"奥斯 施特伦","a":"a9e7efd2ed.mp3"},{"de":"malen","zh":"画","py":"马伦","a":"c292de9b53.mp3"},{"de":"zeichnen","zh":"描画","py":"灿希嫩","a":"a4e2fbb8fb.mp3"},{"de":"herstellen","zh":"制作","py":"赫尔 施特伦","a":"ad89e5f6b8.mp3"},{"de":"sich interessieren für","zh":"对……感兴趣","py":"齐希 因特雷西伦 菲尔","a":"a8e7f34208.mp3"},{"de":"man","zh":"人们（泛指）","py":"曼","a":"8175e3c875.mp3"},{"de":"deshalb","zh":"所以","py":"德斯哈尔普","a":"02fffee884.mp3"}],"grammar":[{"t":"对……感兴趣：sich interessieren für","zh":"「我感兴趣」要说 ich interessiere mich，mich 是「我自己」。für 后面接第 4 格。","ex":[{"de":"Ich interessiere mich für Dinosaurier.","zh":"我对恐龙感兴趣。","py":"伊希 因特雷西勒 米希 菲尔 迪诺扎乌里尔。","a":"70c5db233b.mp3"},{"de":"Interessierst du dich für Bilder?","zh":"你对画感兴趣吗？","py":"因特雷西尔斯特 杜 迪希 菲尔 比尔德尔？","a":"037febd172.mp3"}]},{"t":"组合名词：……+ Museum","zh":"德语把两个名词拼成一个：Spielzeug（玩具）+ Museum → Spielzeugmuseum（玩具博物馆）。词性看最后一个词。","ex":[{"de":"Das ist ein Uhrenmuseum.","zh":"这是一个钟表博物馆。","py":"达斯 伊斯特 艾因 乌伦 穆泽乌姆。","a":"2f5e04f594.mp3"}]},{"t":"「人们」：man","zh":"man 泛指「人」，动词和 er/sie 一样变。","ex":[{"de":"Im Museum kann man viel sehen.","zh":"在博物馆里能看到很多东西。","py":"伊姆 穆泽乌姆 坎 曼 菲尔 泽恩。","a":"7bf932468e.mp3"},{"de":"Bitte nicht berühren!","zh":"请勿触摸！","py":"比特 尼希特 贝吕伦！","a":"e7f11000dd.mp3"}]},{"t":"所以：deshalb","zh":"deshalb 放句首时，动词紧跟在后面。","ex":[{"de":"Es regnet, deshalb gehen wir ins Museum.","zh":"下雨了，所以我们去博物馆。","py":"埃斯 雷格内特，德斯哈尔普 盖恩 维尔 因斯 穆泽乌姆。","a":"36d068083a.mp3"}]}],"notes":["奥地利说法：借东西常说 ausborgen（德国多说 ausleihen）。"]}},{"id":"theater","de":"Theater","zh":"剧院","icon":"🎭","bg":["#f6e3ff","#ffe9d6"],"guide":{"teil":6,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-6-theater/","pdf":null,"story":"Zone Ausflug: Theater","storyZh":"出游区：剧院","pages":"","summary":[],"vocab":[{"de":"das Theater","zh":"剧院","py":"达斯 特阿特尔","a":"e0bfb42aeb.mp3"},{"de":"die Bühne","zh":"舞台","py":"迪 比讷","a":"553b7ed943.mp3"},{"de":"der Vorhang","zh":"幕布","py":"戴尔 福尔 杭","a":"87daa4186a.mp3"},{"de":"das Kostüm","zh":"戏服","py":"达斯 科斯蒂姆","a":"86d6cbc268.mp3"},{"de":"die Maske","zh":"面具","py":"迪 马斯克","a":"5d7bae673b.mp3"},{"de":"die Krone","zh":"王冠","py":"迪 克罗讷","a":"627a80cd82.mp3"},{"de":"der König","zh":"国王","py":"戴尔 克尼希","a":"4cc3bd080d.mp3"},{"de":"die Königin","zh":"王后","py":"迪 克尼金","a":"fea1fc6e39.mp3"},{"de":"die Prinzessin","zh":"公主","py":"迪 普林策辛","a":"d8d611980a.mp3"},{"de":"das Publikum","zh":"观众","py":"达斯 普布利库姆","a":"9ef77142f4.mp3"},{"de":"der Applaus","zh":"掌声","py":"戴尔 阿普劳斯","a":"514142139d.mp3"},{"de":"spielen","zh":"演","py":"施皮伦","a":"83b699c50c.mp3"},{"de":"sich verkleiden","zh":"化装、打扮成","py":"齐希 费尔克莱登","a":"38df359240.mp3"},{"de":"klatschen","zh":"拍手","py":"克拉琴","a":"05381e7cc4.mp3"},{"de":"sich verbeugen","zh":"鞠躬","py":"齐希 费尔博伊根","a":"c13de17959.mp3"}],"grammar":[{"t":"扮演：Ich spiele …","zh":"「我演国王」直接说 Ich spiele den König（第 4 格）。","ex":[{"de":"Ich spiele den König.","zh":"我演国王。","py":"伊希 施皮勒 登 克尼希。","a":"36a351c035.mp3"},{"de":"Wer spielt die Prinzessin?","zh":"谁演公主？","py":"维尔 施皮尔特 迪 普林策辛？","a":"e1b5593969.mp3"}]},{"t":"打扮成：sich verkleiden als","zh":"「我打扮成……」说 Ich verkleide mich als …","ex":[{"de":"Ich verkleide mich als Tiger.","zh":"我打扮成老虎。","py":"伊希 费尔克莱德 米希 阿尔斯 蒂格尔。","a":"b6c75d7f85.mp3"}]}],"notes":["这一课官网暂时没有放 PDF，按钮会打开官方本课网页。下面的词和句子是本站补充的剧院常用词，不是官方生词表。"]}},{"id":"konzert","de":"Konzert","zh":"音乐会","icon":"🎻","bg":["#e6f0ff","#f3e6ff"],"guide":{"teil":7,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-7-konzert/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-7-Konzert.pdf","story":"Trompete, Triangel und Zaubertrommel","storyZh":"小号、三角铁和魔法鼓","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦站在一座露天大舞台门口，看海报上画着好多乐器：镲、手鼓、沙锤、小号。一位拎着小提琴盒的女士邀请她十天后来听儿童音乐会《女巫和魔法鼓》，然后匆匆赶去排练。","伊尔瓦跟着琴声走进去，悄悄坐在一把空椅子上。指挥挥着指挥棒，乐手们一会儿快一会儿慢。低音提琴低沉的声音让她起了鸡皮疙瘩，她想起了故事里危险的女巫。","排练结束，大家离开，灯也灭了。伊尔瓦偷偷溜上舞台，按了几下黑色的钢琴：按得越重，声音越响。","灯又亮了，指挥发现了她。伊尔瓦介绍了自己，指挥给她讲了低音提琴和谱架。这时一页乐谱滑到了钢琴底下，黑乎乎的够不着。","伊尔瓦用魔法袜子把自己变成手电筒，照亮钢琴底下，帮指挥找回了那页乐谱。","指挥问她想不想学一种乐器。伊尔瓦说：我更想自己变成乐器——三角铁、沙锤或者钟琴！指挥笑了，邀请她来下一次排练。"],"vocab":[{"de":"das Konzert","zh":"音乐会","py":"达斯 孔采尔特","a":"892eece699.mp3"},{"de":"das Instrument","zh":"乐器","py":"达斯 因斯特鲁门特","a":"343fbc85bf.mp3"},{"de":"die Trommel","zh":"鼓","py":"迪 特罗梅尔","a":"aa1d3036ac.mp3"},{"de":"die Triangel","zh":"三角铁","py":"迪 特里昂格尔","a":"1b70862df6.mp3"},{"de":"die Trompete","zh":"小号","py":"迪 特罗姆佩特","a":"180105c8a0.mp3"},{"de":"die Geige","zh":"小提琴","py":"迪 盖格","a":"39ce173993.mp3"},{"de":"die Flöte","zh":"笛子","py":"迪 弗勒特","a":"f23cde5b2f.mp3"},{"de":"das Klavier","zh":"钢琴","py":"达斯 克拉维尔","a":"c1b7d76281.mp3"},{"de":"der Kontrabass","zh":"低音提琴","py":"戴尔 孔特拉巴斯","a":"ca100ddfb8.mp3"},{"de":"die Rassel","zh":"沙锤","py":"迪 拉塞尔","a":"459f4f5870.mp3"},{"de":"das Glockenspiel","zh":"钟琴","py":"达斯 格洛肯 施皮尔","a":"a4fb468f1a.mp3"},{"de":"die Tschinelle","zh":"镲（奥地利说法）","py":"迪 钦内勒","a":"30b4581286.mp3"},{"de":"der Dirigent","zh":"指挥","py":"戴尔 迪里根特","a":"9ac6064b29.mp3"},{"de":"die Melodie","zh":"旋律","py":"迪 梅洛迪","a":"2cf86dbf58.mp3"},{"de":"spielen","zh":"演奏","py":"施皮伦","a":"83b699c50c.mp3"},{"de":"schlagen","zh":"敲","py":"施拉根","a":"0c08d34890.mp3"},{"de":"blasen","zh":"吹","py":"布拉森","a":"6ea515980b.mp3"},{"de":"zupfen","zh":"拨（弦）","py":"楚普芬","a":"89c67f68b0.mp3"},{"de":"zuhören","zh":"听","py":"楚 赫伦","a":"f7a2bb6f5a.mp3"},{"de":"laut","zh":"大声","py":"劳特","a":"d637808d0f.mp3"},{"de":"leise","zh":"小声","py":"莱泽","a":"1680a30b20.mp3"},{"de":"schnell","zh":"快","py":"施内尔","a":"5db660272f.mp3"},{"de":"langsam","zh":"慢","py":"朗扎姆","a":"bb7537501a.mp3"},{"de":"hoch","zh":"（音）高","py":"霍赫","a":"0e98fb6779.mp3"},{"de":"tief","zh":"（音）低","py":"蒂夫","a":"82911669ca.mp3"}],"grammar":[{"t":"用什么演奏：mit + 3 格","zh":"mit 后面用第 3 格：der/das → dem，die → der。","ex":[{"de":"Ich spiele mit dem Schlägel.","zh":"我用琴槌敲。","py":"伊希 施皮勒 米特 登 施莱格尔。","a":"2525b91918.mp3"},{"de":"Die Gitarre wird mit den Fingern gezupft.","zh":"吉他是用手指拨的。","py":"迪 吉塔勒 维尔特 米特 登 芬格恩 格楚普夫特。","a":"165d413cf3.mp3"}]},{"t":"如果……就想到……：wenn … denke ich an …","zh":"wenn 小句的动词放最后，后半句动词放最前。denken an＝想到，后面接第 4 格。","ex":[{"de":"Wenn ich die Gitarre höre, denke ich an meinen Geburtstag.","zh":"我一听到吉他，就想起我的生日。","py":"文 伊希 迪 吉塔勒 赫勒，登克 伊希 安 迈嫩 格布尔茨 塔克。","a":"ffdb58faea.mp3"}]},{"t":"可分动词 vorspielen（演奏给人听）","zh":"Ich spiele dir etwas vor.＝我给你演奏一段。","ex":[{"de":"Ich spiele euch ein Lied vor.","zh":"我给你们演奏一首曲子。","py":"伊希 施皮勒 奥伊希 艾因 利特 福尔。","a":"a5d46aa19e.mp3"}]},{"t":"比较：lauter / leiser","zh":"形容词加 -er 就是「更……」。","ex":[{"de":"Ich kann lauter oder leiser spielen.","zh":"我能弹得更响或更轻。","py":"伊希 坎 劳特尔 奥德尔 莱泽尔 施皮伦。","a":"7f11409168.mp3"}]}],"notes":["奥地利说法：镲叫 die Tschinelle（德国说 das Becken）。"]}},{"id":"zirkus","de":"Zirkus","zh":"马戏团","icon":"🎪","bg":["#ffe3e3","#fff3c4"],"guide":{"teil":8,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-8-zirkus/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-8-Zirkus.pdf","story":"Zirkusduft liegt in der Luft","storyZh":"空气里有马戏团的味道","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦看到「方块马戏团」的海报，走进了马戏场。她看到卖爆米花的、抛球杂耍的、驯狗的，还认识了走钢丝的 Sorin，他带她到处参观。","他们走进圆形表演场，灯光师正在试灯：彩色的星星、三角形、六边形在地上跳来跳去。伊尔瓦发现她的小蚯蚓 Ron 在模仿这些形状。","一个小丑追着光做的星星跑，逗得大家直笑。Sorin 看到 Ron 能摆出各种形状，邀请伊尔瓦下午和他一起上台。","下午的演出开始了：先是杂技演员，然后是飞刀手瞄准靶子上的心形，接着小丑假装从一个方框「窗户」里爬过去。","Sorin 在高高的钢丝上走着，突然平衡杆掉了，人摇摇晃晃。伊尔瓦用魔法袜子变成一张网接在下面，Sorin 安全地表演完了。","最后伊尔瓦带着 Ron 站到聚光灯下，用金色魔法棒在 T 恤上画图形，Ron 跟着摆出正方形、五边形、八边形。观众欢呼，伊尔瓦骄傲地鞠了一躬。"],"vocab":[{"de":"der Zirkus","zh":"马戏团","py":"戴尔 齐尔库斯","a":"2977e1872d.mp3"},{"de":"der Clown","zh":"小丑","py":"戴尔 克劳恩","a":"1908fda6d5.mp3"},{"de":"der Akrobat","zh":"杂技演员","py":"戴尔 阿克罗巴特","a":"63500ad417.mp3"},{"de":"der Seiltänzer","zh":"走钢丝的人","py":"戴尔 赛尔 滕策尔","a":"cc07aa3f7d.mp3"},{"de":"der Zauberer","zh":"魔术师","py":"戴尔 灿贝勒尔","a":"9c83ca97a6.mp3"},{"de":"der Zirkusdirektor","zh":"马戏团团长","py":"戴尔 齐尔库斯 迪雷克托尔","a":"e656297c5d.mp3"},{"de":"der Kreis","zh":"圆形","py":"戴尔 克赖斯","a":"a515a31ac4.mp3"},{"de":"das Quadrat","zh":"正方形","py":"达斯 夸德拉特","a":"db36e5ddcf.mp3"},{"de":"das Rechteck","zh":"长方形","py":"达斯 雷希特 埃克","a":"d83c6fa921.mp3"},{"de":"das Dreieck","zh":"三角形","py":"达斯 德赖 埃克","a":"3ea48f6fd7.mp3"},{"de":"der Stern","zh":"星形","py":"戴尔 施特恩","a":"7b361b4f22.mp3"},{"de":"das Herz","zh":"心形","py":"达斯 赫尔茨","a":"198ba7290d.mp3"},{"de":"die Ecke","zh":"角","py":"迪 埃克","a":"85af43a9b9.mp3"},{"de":"rund","zh":"圆的","py":"伦特","a":"e59dbe1b82.mp3"},{"de":"eckig","zh":"有角的","py":"埃基希","a":"880571dd6c.mp3"},{"de":"quadratisch","zh":"正方形的","py":"夸德拉蒂施","a":"71e4fa14aa.mp3"},{"de":"sternförmig","zh":"星形的","py":"施特恩 弗尔米希","a":"e374bac7ec.mp3"},{"de":"springen","zh":"跳","py":"施普林根","a":"89851a3f0d.mp3"},{"de":"balancieren","zh":"保持平衡","py":"巴朗西伦","a":"017b59fd37.mp3"},{"de":"jonglieren","zh":"抛接杂耍","py":"容格利伦","a":"bb5b3fcea8.mp3"},{"de":"zaubern","zh":"变魔术","py":"灿贝恩","a":"599069a25d.mp3"},{"de":"werfen","zh":"扔","py":"韦尔芬","a":"eff2e31c1f.mp3"}],"grammar":[{"t":"先、然后、最后：zuerst / dann / zuletzt","zh":"讲表演顺序。这些词放句首，动词紧跟着排第二。","ex":[{"de":"Zuerst kommen die Akrobaten, dann kommt der Clown.","zh":"先是杂技演员上场，然后是小丑。","py":"楚埃尔斯特 科门 迪 阿克罗巴滕，丹 科姆特 戴尔 克劳恩。","a":"6833375241.mp3"}]},{"t":"形状变形容词：Stern → sternförmig","zh":"名词加 -förmig 就是「……形的」；Quadrat → quadratisch。","ex":[{"de":"Der Ball ist rund. Er hat keine Ecken.","zh":"球是圆的，没有角。","py":"戴尔 巴尔 伊斯特 伦特。埃尔 哈特 凯讷 埃肯。","a":"e2cbf5a54d.mp3"}]},{"t":"用……做：mit + 3 格","zh":"jonglieren mit＝用……杂耍。","ex":[{"de":"Der Clown jongliert mit einem Ball.","zh":"小丑用一个球玩杂耍。","py":"戴尔 克劳恩 容格利尔特 米特 艾嫩 巴尔。","a":"92580f1aa7.mp3"}]},{"t":"是不是问句：动词放最前","zh":"回答「是／不是」的问句，把动词放到句首。","ex":[{"de":"Bist du ein Seiltänzer?","zh":"你是走钢丝的吗？","py":"比斯特 杜 艾因 赛尔 滕策尔？","a":"eb5c442caf.mp3"},{"de":"Springt der Hund durch den Reifen?","zh":"狗会钻过圈吗？","py":"施普林特 戴尔 洪特 杜尔希 登 赖芬？","a":"4b66f12b21.mp3"}]}],"notes":["Manege：马戏团中间的圆形表演场。"]}},{"id":"stille","de":"Stille","zh":"安静","icon":"🤫","bg":["#e3e8ff","#d9f2ef"],"guide":{"teil":9,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-9-stille/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-9-Stille.pdf","story":"Laterne, Laterne, leuchte still","storyZh":"灯笼灯笼，静静地亮","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["傍晚，伊尔瓦坐在小池塘边的毛巾上，回想开心的一天。大部分游客都回家了，只有几家人留下来搭帐篷过夜，伊尔瓦也搭了一顶。","天慢慢安静下来，她听到各种声音：自行车铃、狗叫、远处的驴叫。紫丁香丛后面有一家人生起了篝火，孩子们在玩充气床垫，一只松鼠跑回窝里睡觉。","那家人钻进帐篷。鸟还在叫，伊尔瓦觉得冷，蚊子还咬了她膝盖一口，她把毯子裹紧。隔壁帐篷传来呼噜声，森林里猫头鹰在叫，池塘里青蛙呱呱叫。","一只小老鼠在吃最后的饼干渣，月亮从水面升起来。伊尔瓦指给小蚯蚓 Ron 看，一只蝙蝠飞过，Ron 吓得钻进她头发里。","突然，隔壁帐篷外的沙桶被什么东西撞倒了。孩子们吓坏了，想回家。爸爸妈妈出去一看，原来是一只小刺猬。","伊尔瓦想帮忙。她晃晃魔法袜子，变成一盏灯笼，柔和的光照着帐篷。孩子们安心了，又睡着了。"],"vocab":[{"de":"die Stille","zh":"安静","py":"迪 施蒂勒","a":"fd9171e405.mp3"},{"de":"das Geräusch","zh":"声音、响动","py":"达斯 格罗伊施","a":"eb7b2ad227.mp3"},{"de":"laut","zh":"吵、大声","py":"劳特","a":"d637808d0f.mp3"},{"de":"leise","zh":"轻声","py":"莱泽","a":"1680a30b20.mp3"},{"de":"dunkel","zh":"黑、暗","py":"敦克尔","a":"3e2f251af3.mp3"},{"de":"hell","zh":"亮","py":"黑尔","a":"a5cec7af5f.mp3"},{"de":"das Zelt","zh":"帐篷","py":"达斯 采尔特","a":"27f55948ae.mp3"},{"de":"der Teich","zh":"池塘","py":"戴尔 泰希","a":"41998dffe8.mp3"},{"de":"der Wald","zh":"森林","py":"戴尔 瓦尔特","a":"8765f1181d.mp3"},{"de":"der Mond","zh":"月亮","py":"戴尔 蒙特","a":"9b13ca64e3.mp3"},{"de":"der Frosch","zh":"青蛙","py":"戴尔 弗罗施","a":"c51a3292b7.mp3"},{"de":"die Mücke","zh":"蚊子","py":"迪 米克","a":"8a9ef3f579.mp3"},{"de":"der Uhu","zh":"猫头鹰","py":"戴尔 乌胡","a":"befc087c99.mp3"},{"de":"der Igel","zh":"刺猬","py":"戴尔 伊格尔","a":"4d759e78a5.mp3"},{"de":"das Eichhörnchen","zh":"松鼠","py":"达斯 艾希 赫恩欣","a":"6220a386fd.mp3"},{"de":"die Fledermaus","zh":"蝙蝠","py":"迪 弗莱德尔 毛斯","a":"4314caf949.mp3"},{"de":"der Esel","zh":"驴","py":"戴尔 埃泽尔","a":"d0bd7d9c2a.mp3"},{"de":"hören","zh":"听","py":"赫伦","a":"5abe95a270.mp3"},{"de":"schnarchen","zh":"打呼噜","py":"施纳尔兴","a":"8d5328fc18.mp3"},{"de":"bellen","zh":"（狗）叫","py":"贝伦","a":"50bce5288c.mp3"},{"de":"quaken","zh":"（青蛙）呱呱叫","py":"夸肯","a":"19e300feca.mp3"},{"de":"summen","zh":"嗡嗡叫","py":"祖门","a":"857c0fec32.mp3"},{"de":"zwitschern","zh":"（鸟）叽叽喳喳","py":"茨维琴恩","a":"3bd8c083e1.mp3"},{"de":"rascheln","zh":"沙沙响","py":"拉舍尔恩","a":"ab0f600790.mp3"},{"de":"zelten","zh":"露营","py":"采尔滕","a":"d2bb42e7bd.mp3"}],"grammar":[{"t":"谁发出什么声音","zh":"每种动物有自己的「叫」：狗 bellt，青蛙 quakt，蚊子 summt，鸟 zwitschert。","ex":[{"de":"Der Frosch quakt im Teich.","zh":"青蛙在池塘里呱呱叫。","py":"戴尔 弗罗施 夸克特 伊姆 泰希。","a":"aa3faedcea.mp3"},{"de":"Die Mücken summen laut.","zh":"蚊子嗡嗡地叫得很响。","py":"迪 米肯 祖门 劳特。","a":"576b751ad5.mp3"}]},{"t":"我听到……：hören + 4 格","zh":"听到的东西是第 4 格：der → den。","ex":[{"de":"Ich höre den Hund.","zh":"我听到狗叫了。","py":"伊希 赫勒 登 洪特。","a":"c924aa2841.mp3"}]},{"t":"叫别人做：命令句","zh":"对一个人说「你做……」：动词去掉 -en 放句首（Leg …! Hör …!）。","ex":[{"de":"Hör mal! Was ist das?","zh":"听！那是什么？","py":"赫尔 马尔！瓦斯 伊斯特 达斯？","a":"06d0399347.mp3"},{"de":"Sei leise!","zh":"小声点！","py":"赛 莱泽！","a":"612069e791.mp3"}]},{"t":"声音词：叠起来说","zh":"德语也有拟声词，常常重复两遍：knack knack（咔嚓咔嚓）。","ex":[{"de":"Das Eichhörnchen knackt Nüsse.","zh":"松鼠在咔嚓咔嚓地嗑坚果。","py":"达斯 艾希 赫恩欣 克纳克特 尼塞。","a":"c0aca97035.mp3"}]}],"notes":["标题里的 Laterne 是灯笼，奥地利和德国孩子秋天会提灯笼游行（Laternenfest）。"]}},{"id":"wiese","de":"Wiese","zh":"草地","icon":"🌼","bg":["#e8f8d8","#fff8cf"],"guide":{"teil":10,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-10-wiese/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-10-Wiese.pdf","story":"Eins, zwei, viele … beim Wiesenpicknick","storyZh":"一、二、好多……草地野餐","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦在森林边的草地上野餐，把点心摆在毯子上，晒着太阳看花。小蚯蚓 Ron 在她头发里爬来爬去。","一只瓢虫落在毯子上，伊尔瓦数它的斑点。蜜蜂围着她的坚果牛角包嗡嗡转，一只黄蝴蝶飞过，树上鸟在唱歌。","伊尔瓦把 Ron 绕在手指上走进森林。树叶下一只马陆匆匆爬走，石头下有一只潮虫，她轻轻把石头放回去。","她找到两条蚯蚓 Rita 和 Robert，Ron 也跟它们玩去了。伊尔瓦想起放大镜忘在毯子上，就用魔法袜子把自己变小。","变小的伊尔瓦差点撞进一张巨大的蜘蛛网，蜘蛛丝粗得像绳子。她又碰到一队蚂蚁，正搬着树叶和松针。","松针太重她搬不动，就搬了一点青苔跟着蚂蚁走。路过一只慢吞吞的蜗牛时，她在黏液上滑了一跤，青苔正好飞到了蚁丘上。她变回原样，一只青蛙惊讶地看着她。","回家路上，伊尔瓦从蹦来蹦去的蚂蚱旁边跳过，跟 Ron 说：今天野餐碰到了好多小动物！"],"vocab":[{"de":"die Wiese","zh":"草地","py":"迪 维泽","a":"6bf086583d.mp3"},{"de":"die Ameise","zh":"蚂蚁","py":"迪 阿迈泽","a":"a5ae98b7c9.mp3"},{"de":"die Biene","zh":"蜜蜂","py":"迪 比讷","a":"9aceaecf8d.mp3"},{"de":"der Schmetterling","zh":"蝴蝶","py":"戴尔 施梅特林","a":"267cc6705a.mp3"},{"de":"der Marienkäfer","zh":"瓢虫","py":"戴尔 马里恩 凯弗尔","a":"bc4fbddf75.mp3"},{"de":"die Schnecke","zh":"蜗牛","py":"迪 施内克","a":"5be0696a31.mp3"},{"de":"die Spinne","zh":"蜘蛛","py":"迪 施宾讷","a":"d3c2bb40ca.mp3"},{"de":"der Regenwurm","zh":"蚯蚓","py":"戴尔 雷根 武尔姆","a":"28552d29ef.mp3"},{"de":"die Heuschrecke","zh":"蚂蚱","py":"迪 霍伊 施雷克","a":"101a25b4c6.mp3"},{"de":"der Tausendfüßler","zh":"马陆（千足虫）","py":"戴尔 陶森特 菲斯勒","a":"38837f2cc8.mp3"},{"de":"die Assel","zh":"潮虫","py":"迪 阿塞尔","a":"d3d149a65f.mp3"},{"de":"der Frosch","zh":"青蛙","py":"戴尔 弗罗施","a":"c51a3292b7.mp3"},{"de":"krabbeln","zh":"爬（小虫）","py":"克拉贝尔恩","a":"fab03f7d64.mp3"},{"de":"kriechen","zh":"爬（蜗牛、蚯蚓）","py":"克里兴","a":"db55971aba.mp3"},{"de":"flattern","zh":"扑腾着飞","py":"弗拉特恩","a":"522b1d088a.mp3"},{"de":"fliegen","zh":"飞","py":"弗利根","a":"0524ba6632.mp3"},{"de":"hüpfen","zh":"蹦","py":"许普芬","a":"3b9d00efa1.mp3"},{"de":"springen","zh":"跳","py":"施普林根","a":"89851a3f0d.mp3"},{"de":"zuerst","zh":"首先","py":"楚埃尔斯特","a":"dea8551b8c.mp3"},{"de":"danach","zh":"之后","py":"达纳赫","a":"b9de39d8ad.mp3"}],"grammar":[{"t":"谁怎么动：über die Wiese","zh":"不同的小动物用不同的「动」：蚂蚁 krabbelt，蜗牛 kriecht，蝴蝶 flattert，青蛙 hüpft。","ex":[{"de":"Die Ameise krabbelt über die Wiese.","zh":"蚂蚁爬过草地。","py":"迪 阿迈泽 克拉贝尔特 于贝尔 迪 维泽。","a":"c9f44e89f6.mp3"},{"de":"Der Frosch hüpft über die Wiese.","zh":"青蛙蹦过草地。","py":"戴尔 弗罗施 许普夫特 于贝尔 迪 维泽。","a":"15434aaad3.mp3"}]},{"t":"讲过去的事：ist … gekrabbelt","zh":"表示移动的动词说过去时用 sein + 过去分词（ge- … -t），分词放句尾。","ex":[{"de":"Zuerst ist der Schmetterling geflattert.","zh":"先是蝴蝶扑腾着飞走了。","py":"楚埃尔斯特 伊斯特 戴尔 施梅特林 格弗拉特尔特。","a":"13a05cafde.mp3"},{"de":"Danach ist die Spinne gekrabbelt.","zh":"然后蜘蛛爬走了。","py":"达纳赫 伊斯特 迪 施宾讷 格克拉贝尔特。","a":"e4677d5b38.mp3"}]},{"t":"是不是：ob（是否）","zh":"Ich weiß nicht, ob …＝我不知道是不是……，动词放最后。","ex":[{"de":"Ich weiß nicht, ob die Schnecke schläft.","zh":"我不知道蜗牛是不是在睡觉。","py":"伊希 魏斯 尼希特，奥普 迪 施内克 施莱夫特。","a":"3050c40ee3.mp3"}]}],"notes":["Nusskipferl：奥地利的坚果牛角小点心。"]}},{"id":"streichelzoo","de":"Streichelzoo","zh":"小动物园","icon":"🐐","bg":["#f3ecd9","#e3f5e1"],"guide":{"teil":11,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-11-streichelzoo/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-11-Streichelzoo.pdf","story":"Futter für die Tiere","storyZh":"给动物喂吃的","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦和 Alina、Alina 的弟弟 Finn，跟着 Alina 的爸爸去一个可以摸小动物的动物园。她看到了豚鼠、小马、两只羊，谷仓边还有小猪。","在鸭子池塘边，一只绿脑袋的鸭子朝 Finn 游过来，Finn 以为它要咬他，吓坏了。爸爸安慰他：鸭子不会吃你的。","爸爸想了个办法，带孩子们去饲料机，每人拿到一袋饲料喂饿肚子的动物。","孩子们想先喂兔子，可兔子都在生菜和胡萝卜中间趴着休息，不过来。大家就去山羊那边。","一只好奇的山羊把头伸出栅栏，Alina 用手喂它，伊尔瓦摸摸它的头。伊尔瓦把魔法袜子挥三下，变成一只山羊，和它聊天。变回来后她说：山羊在谢谢我们，问我们什么时候再来。","一头驴也跑过来，大声讨吃的，驴和山羊一起「开演唱会」。爸爸笑着说：我们一定很快再来！"],"vocab":[{"de":"der Streichelzoo","zh":"可以摸动物的小动物园","py":"戴尔 施特赖希尔 措","a":"81e3f79b07.mp3"},{"de":"die Ziege","zh":"山羊","py":"迪 齐格","a":"6fdbb3d3df.mp3"},{"de":"das Pony","zh":"小马","py":"达斯 波尼","a":"cc644eff11.mp3"},{"de":"der Hase","zh":"兔子","py":"戴尔 哈泽","a":"861a54d213.mp3"},{"de":"das Meerschweinchen","zh":"豚鼠","py":"达斯 梅尔 施魏恩欣","a":"dd212f1b87.mp3"},{"de":"das Huhn","zh":"鸡","py":"达斯 胡恩","a":"9c8b666c6e.mp3"},{"de":"das Schaf","zh":"羊","py":"达斯 沙夫","a":"1c9b51b27c.mp3"},{"de":"der Esel","zh":"驴","py":"戴尔 埃泽尔","a":"d0bd7d9c2a.mp3"},{"de":"das Schwein","zh":"猪","py":"达斯 施魏恩","a":"58ea9e42c9.mp3"},{"de":"die Ente","zh":"鸭子","py":"迪 恩特","a":"4c529b577b.mp3"},{"de":"das Heu","zh":"干草","py":"达斯 霍伊","a":"1ac55bee50.mp3"},{"de":"das Futter","zh":"饲料","py":"达斯 富特尔","a":"4414e3b8c1.mp3"},{"de":"der Stall","zh":"棚、圈","py":"戴尔 施塔尔","a":"d693c2ee13.mp3"},{"de":"der Huf","zh":"蹄子","py":"戴尔 胡夫","a":"13a566a07b.mp3"},{"de":"die Pfote","zh":"爪子","py":"迪 普福特","a":"437dd72fef.mp3"},{"de":"der Flügel","zh":"翅膀","py":"戴尔 弗吕格尔","a":"6cef207e00.mp3"},{"de":"laufen","zh":"跑","py":"劳芬","a":"d4fdb66624.mp3"},{"de":"hoppeln","zh":"（兔子）蹦","py":"霍佩尔恩","a":"7a157cf3db.mp3"},{"de":"galoppieren","zh":"飞奔","py":"加洛皮伦","a":"6d61890685.mp3"},{"de":"traben","zh":"小跑","py":"特拉本","a":"f6b4f45989.mp3"},{"de":"schwimmen","zh":"游","py":"施维门","a":"73719498e2.mp3"},{"de":"füttern","zh":"喂","py":"菲特恩","a":"397aec5a8a.mp3"}],"grammar":[{"t":"将来：werden + 动词原形","zh":"werden 放第二位，动词原形放最后，表示「将要」。","ex":[{"de":"Morgen werden wir Enten sehen.","zh":"明天我们会看到鸭子。","py":"摩根 韦尔登 维尔 恩滕 泽恩。","a":"a5a9ed0ca0.mp3"}]},{"t":"没有：kein / keine","zh":"「一只也没有」用 kein/keine。","ex":[{"de":"Keine Ente will dich beißen.","zh":"没有一只鸭子想咬你。","py":"凯讷 恩特 维尔 迪希 拜森。","a":"9024414d1b.mp3"}]},{"t":"跑到哪儿去了：ist … gelaufen","zh":"表示移动的过去时用 sein，分词放句尾。","ex":[{"de":"Das Pony ist in den Stall galoppiert.","zh":"小马飞奔进了马棚。","py":"达斯 波尼 伊斯特 因 登 施塔尔 加洛皮尔特。","a":"0983effac5.mp3"},{"de":"Der Hase hoppelt zu den Karotten.","zh":"兔子蹦向胡萝卜。","py":"戴尔 哈泽 霍佩尔特 楚 登 卡罗滕。","a":"e3c163c0c0.mp3"}]},{"t":"变小：-chen","zh":"名词加 -chen 表示「小……」，而且一律变成 das：das Schwein → das Schweinchen。","ex":[{"de":"Das ist ein Schweinchen.","zh":"这是一只小猪。","py":"达斯 伊斯特 艾因 施魏恩欣。","a":"3fb5992f13.mp3"}]}],"notes":[]}},{"id":"spielplatz","de":"Spielplatz","zh":"游乐场","icon":"🛝","bg":["#e1f3ff","#fff1d6"],"guide":{"teil":12,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-12-spielplatz/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-12-Spielplatz.pdf","story":"Spielplatz","storyZh":"游乐场","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["这一课官方 PDF 开头印的故事和第 10 课一样（伊尔瓦在草地野餐，跟着蚂蚁走，最后蚯蚓 Ron 也在）。可以先看第 10 课的中文梗概。","本课的练习围绕游乐场：滑梯、秋千、跷跷板、攀爬架，重点是学会说「谁更快、谁更高」。"],"vocab":[{"de":"der Spielplatz","zh":"游乐场","py":"戴尔 施皮尔 普拉茨","a":"3c5477aa55.mp3"},{"de":"die Rutsche","zh":"滑梯","py":"迪 鲁彻","a":"b542ff728e.mp3"},{"de":"die Schaukel","zh":"秋千","py":"迪 绍克尔","a":"87b1c00b26.mp3"},{"de":"die Wippe","zh":"跷跷板","py":"迪 维佩","a":"6e713e8158.mp3"},{"de":"das Drehkarussell","zh":"转盘","py":"达斯 德雷 卡鲁塞尔","a":"282e032751.mp3"},{"de":"die Sandkiste","zh":"沙坑（奥地利说法）","py":"迪 赞特 基斯特","a":"326e43b3d9.mp3"},{"de":"das Klettergerüst","zh":"攀爬架","py":"达斯 克莱特尔 格吕斯特","a":"610c3e5923.mp3"},{"de":"das Fußballtor","zh":"足球门","py":"达斯 富斯巴尔 托尔","a":"c21d4743a7.mp3"},{"de":"rutschen","zh":"滑","py":"鲁琴","a":"b8231e8509.mp3"},{"de":"schaukeln","zh":"荡秋千","py":"绍克尔恩","a":"bf3a7d91a1.mp3"},{"de":"wippen","zh":"玩跷跷板","py":"维喷","a":"1494e35a48.mp3"},{"de":"klettern","zh":"爬","py":"克莱特恩","a":"8174cb0a0b.mp3"},{"de":"graben","zh":"挖","py":"格拉本","a":"1c3555bb1c.mp3"},{"de":"rennen","zh":"跑","py":"雷嫩","a":"98fcdaf358.mp3"},{"de":"schnell","zh":"快","py":"施内尔","a":"5db660272f.mp3"},{"de":"hoch","zh":"高","py":"霍赫","a":"0e98fb6779.mp3"},{"de":"tief","zh":"深","py":"蒂夫","a":"82911669ca.mp3"},{"de":"weit","zh":"远","py":"魏特","a":"c505ee4b74.mp3"},{"de":"wild","zh":"疯、野","py":"维尔特","a":"0ce0cb683d.mp3"},{"de":"sanft","zh":"轻柔","py":"赞夫特","a":"dd67190e80.mp3"}],"grammar":[{"t":"比较：schneller / am schnellsten","zh":"形容词加 -er＝「更……」，am …-sten＝「最……」。hoch 特殊：höher, am höchsten。","ex":[{"de":"Wir schaukeln schneller!","zh":"我们荡得更快了！","py":"维尔 绍克尔恩 施内勒尔！","a":"b635dbbf4d.mp3"},{"de":"Du bist am höchsten geklettert.","zh":"你爬得最高。","py":"杜 比斯特 阿姆 赫希斯滕 格克莱特尔特。","a":"8bf79fb444.mp3"}]},{"t":"我觉得：Ich glaube, dass …","zh":"dass 小句里动词放最后。","ex":[{"de":"Ich glaube, dass Ron am schnellsten rutscht.","zh":"我觉得 Ron 滑得最快。","py":"伊希 格劳贝，达斯 龙 阿姆 施内尔斯滕 鲁奇特。","a":"08d18e8a80.mp3"}]},{"t":"讲玩过的：ist gerutscht / hat geschaukelt","zh":"移动类（rutschen, klettern）用 sein，其他多用 haben。","ex":[{"de":"Ich bin gerutscht und habe geschaukelt.","zh":"我滑了滑梯，还荡了秋千。","py":"伊希 宾 格鲁奇特 翁特 哈贝 格绍克尔特。","a":"56fa42f888.mp3"}]}],"notes":["奥地利说法：沙坑叫 die Sandkiste（德国说 der Sandkasten）。"]}},{"id":"baustelle","de":"Baustelle","zh":"工地","icon":"🚧","bg":["#fff2c4","#ffe0cc"],"guide":{"teil":13,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-13-baustelle/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-13-Baustelle.pdf","story":"Hasenrettung auf der Baustelle","storyZh":"工地救兔子","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦路过一个工地，正在盖一栋大房子，吵得她捂住耳朵。吊车吊着木板，工人用风镐打碎混凝土，还有一台机器，伊尔瓦以为是做棉花糖的。","风镐停了，伊尔瓦去问工人。工人说：那是混凝土搅拌机；旁边的是叉车，用来卸水泥袋；大压路机是用来把柏油压平的。伊尔瓦开玩笑说：盖坏了的房子也能压平。","两个孩子 Linda 和 Hassan 抱着一只叫「兔子」的毛绒兔走到围栏边。伊尔瓦指给他们看挖掘机，挖土像挖云朵一样轻松。","Hassan 看得入迷，手一松，毛绒兔从围栏下滚进了工地的大坑。挖掘机的铲斗离它越来越近，Hassan 哭了起来。","伊尔瓦喊司机，可他听不见。她用魔法袜子变成一个建筑工人，吹了一声响亮的口哨，挖掘机停下了。她爬进坑里，把兔子救了上来。","司机夸她救得好，Hassan 谢谢伊尔瓦。伊尔瓦变回原样，跟孩子们说再见，唱着歌蹦蹦跳跳地走了。"],"vocab":[{"de":"die Baustelle","zh":"工地","py":"迪 鲍 施特勒","a":"7ac1958670.mp3"},{"de":"der Bagger","zh":"挖掘机","py":"戴尔 巴格尔","a":"a60b1f3369.mp3"},{"de":"der Kran","zh":"吊车","py":"戴尔 克兰","a":"8ec1a7b4f5.mp3"},{"de":"die Walze","zh":"压路机","py":"迪 瓦尔策","a":"b9abfc6759.mp3"},{"de":"der Betonmischer","zh":"混凝土搅拌车","py":"戴尔 贝通 米舍尔","a":"197a2ba9ab.mp3"},{"de":"der Kipplaster","zh":"自卸卡车","py":"戴尔 基普 拉斯特尔","a":"192ad85202.mp3"},{"de":"der Gabelstapler","zh":"叉车","py":"戴尔 加贝尔 施塔普勒","a":"b04b38c31f.mp3"},{"de":"der Presslufthammer","zh":"风镐","py":"戴尔 普雷斯卢夫特 哈默尔","a":"818d6e33da.mp3"},{"de":"der Ziegelstein","zh":"砖","py":"戴尔 齐格尔 施泰因","a":"829e75dff2.mp3"},{"de":"der Helm","zh":"安全帽","py":"戴尔 黑尔姆","a":"68a03d1d7b.mp3"},{"de":"die Arbeitshandschuhe","zh":"劳保手套","py":"迪 阿尔拜茨 汉特舒厄","a":"d6da741e8d.mp3"},{"de":"bauen","zh":"建造","py":"包恩","a":"ba998885c4.mp3"},{"de":"graben","zh":"挖","py":"格拉本","a":"1c3555bb1c.mp3"},{"de":"heben","zh":"举、吊","py":"黑本","a":"26c785822d.mp3"},{"de":"abladen","zh":"卸货","py":"阿普 拉登","a":"f7402c2d0d.mp3"},{"de":"wegschieben","zh":"推走","py":"韦克 希本","a":"866dae0d4c.mp3"},{"de":"brauchen","zh":"需要","py":"布劳亨","a":"0170381569.mp3"},{"de":"schwer","zh":"重","py":"施维尔","a":"98a0407ec2.mp3"},{"de":"tief","zh":"深","py":"蒂夫","a":"82911669ca.mp3"},{"de":"sicher","zh":"安全","py":"齐舍尔","a":"20f12efca8.mp3"},{"de":"wozu","zh":"用来干什么","py":"沃楚","a":"fa38c38eb9.mp3"}],"grammar":[{"t":"干什么用：Wozu …? – Um … zu …","zh":"问用途用 wozu；回答用 um … zu + 动词原形。","ex":[{"de":"Wozu braucht man die Walze?","zh":"压路机是干什么用的？","py":"沃楚 布劳赫特 曼 迪 瓦尔策？","a":"634e4bdeaf.mp3"},{"de":"Um die Straße glatt zu rollen.","zh":"用来把路压平。","py":"乌姆 迪 施特拉塞 格拉特 楚 罗伦。","a":"e76c7666e9.mp3"}]},{"t":"可分动词：lädt … ab","zh":"abladen（卸下）在句子里拆开：lädt 排第二，ab 放最后。","ex":[{"de":"Der Gabelstapler lädt die Säcke ab.","zh":"叉车把袋子卸下来。","py":"戴尔 加贝尔 施塔普勒 莱特 迪 泽克 阿普。","a":"a0149537a9.mp3"}]},{"t":"需要：brauchen + 4 格","zh":"brauchen 后面的东西用第 4 格：der → den。","ex":[{"de":"Ich brauche den Helm.","zh":"我需要安全帽。","py":"伊希 布劳厄 登 黑尔姆。","a":"3e5f50290e.mp3"}]},{"t":"用什么做：Damit …","zh":"damit＝用这个。","ex":[{"de":"Das ist ein Betonmischer. Damit wird Beton gemischt.","zh":"这是混凝土搅拌机，用来搅拌混凝土。","py":"达斯 伊斯特 艾因 贝通 米舍尔。达米特 维尔特 贝通 格米施特。","a":"8130c30716.mp3"}]}],"notes":[]}},{"id":"supermarkt","de":"Supermarkt","zh":"超市","icon":"🛒","bg":["#e6f8e0","#fff6d1"],"focus":"句型：Ich kaufe Brot.（我买面包。）/ Wir brauchen Milch.（我们需要牛奶。）名词前的 der / die / das 要和名词一起记。","items":[{"e":"🍞","art":"das","de":"Brot","zh":"面包","py":"达斯 布罗特","s":"Ich kaufe Brot.","sz":"我买面包。","sp":"伊希 考费 布罗特。","wa":"ec5a814733.mp3","sa":"6e0c231b18.mp3"},{"e":"🥛","art":"die","de":"Milch","zh":"牛奶","py":"迪 米尔希","s":"Die Milch ist kalt.","sz":"牛奶是凉的。","sp":"迪 米尔希 伊斯特 卡尔特。","wa":"5923ede295.mp3","sa":"d9906337d0.mp3"},{"e":"🧀","art":"der","de":"Käse","zh":"奶酪","py":"戴尔 凯泽","s":"Ich mag Käse.","sz":"我喜欢奶酪。","sp":"伊希 马克 凯泽。","wa":"83398676f2.mp3","sa":"09f3b80e6e.mp3"},{"e":"🥕","art":"die","de":"Karotte","zh":"胡萝卜","py":"迪 卡罗特","s":"Der Hase isst eine Karotte.","sz":"兔子吃一根胡萝卜。","sp":"戴尔 哈泽 伊斯特 艾讷 卡罗特。","wa":"c826694ff5.mp3","sa":"967547d8bb.mp3"},{"e":"🍅","art":"die","de":"Tomate","zh":"西红柿","py":"迪 托马特","s":"Die Tomate ist rot.","sz":"西红柿是红色的。","sp":"迪 托马特 伊斯特 罗特。","wa":"586db53009.mp3","sa":"5d75fe1b4d.mp3"},{"e":"🥚","art":"das","de":"Ei","zh":"鸡蛋","py":"达斯 艾","s":"Wir brauchen sechs Eier.","sz":"我们需要六个鸡蛋。","sp":"维尔 布劳亨 泽克斯 艾尔。","wa":"6ea462a8ab.mp3","sa":"5d3fa3672d.mp3"},{"e":"🧃","art":"der","de":"Saft","zh":"果汁","py":"戴尔 扎夫特","s":"Der Saft ist süß.","sz":"果汁是甜的。","sp":"戴尔 扎夫特 伊斯特 聚斯。","wa":"d11ee02e30.mp3","sa":"c197951306.mp3"},{"e":"🍌","art":"die","de":"Banane","zh":"香蕉","py":"迪 巴纳讷","s":"Ich möchte eine Banane.","sz":"我想要一根香蕉。","sp":"伊希 默希特 艾讷 巴纳讷。","wa":"207364aa5c.mp3","sa":"4d8d845ac3.mp3"},{"e":"🍦","art":"das","de":"Eis","zh":"冰淇淋","py":"达斯 艾斯","s":"Darf ich ein Eis haben?","sz":"我可以吃个冰淇淋吗？","sp":"达尔夫 伊希 艾因 艾斯 哈本？","wa":"6a9fb3368a.mp3","sa":"7e7b67d25c.mp3"},{"e":"🛒","art":"der","de":"Einkaufswagen","zh":"购物车","py":"戴尔 艾因考夫斯瓦根","s":"Der Einkaufswagen ist voll.","sz":"购物车装满了。","sp":"戴尔 艾因考夫斯瓦根 伊斯特 福尔。","wa":"9648783602.mp3","sa":"ec5f77bc90.mp3"},{"e":"💶","art":"das","de":"Geld","zh":"钱","py":"达斯 格尔特","s":"Mama bezahlt mit Geld.","sz":"妈妈用钱付账。","sp":"妈妈 贝察尔特 米特 格尔特。","wa":"a513ac8723.mp3","sa":"0991af312b.mp3"}],"story":{"de":"Einkaufen mit Mama","zh":"和妈妈去超市","lines":[{"e":"🦦🛒","de":"Otti und Mama gehen in den Supermarkt.","zh":"奥蒂和妈妈去超市。","py":"奥蒂 翁特 妈妈 盖恩 因 登 祖佩尔马尔克特。","a":"b58f4ea93d.mp3"},{"e":"📝","de":"Mama hat eine Liste.","zh":"妈妈有一张购物清单。","py":"妈妈 哈特 艾讷 利斯特。","a":"d3e7c8c259.mp3"},{"e":"🍞🥛","de":"Wir brauchen Brot und Milch.","zh":"我们需要面包和牛奶。","py":"维尔 布劳亨 布罗特 翁特 米尔希。","a":"cf5abf689b.mp3"},{"e":"🍅🥕","de":"Otti holt Tomaten und Karotten.","zh":"奥蒂去拿西红柿和胡萝卜。","py":"奥蒂 霍尔特 托马滕 翁特 卡罗滕。","a":"b4b7c35f45.mp3"},{"e":"🍦👀","de":"Mama, darf ich ein Eis haben?","zh":"妈妈，我可以吃个冰淇淋吗？","py":"妈妈，达尔夫 伊希 艾因 艾斯 哈本？","a":"be6f8ff7db.mp3"},{"e":"🙂","de":"Ja, aber nur ein kleines!","zh":"可以，不过只能要个小的！","py":"亚，阿伯尔 努尔 艾因 克莱讷斯！","a":"a2f8223273.mp3"},{"e":"💶","de":"An der Kasse bezahlt Mama.","zh":"妈妈在收银台付钱。","py":"安 戴尔 卡塞 贝察尔特 妈妈。","a":"5ced7a1246.mp3"},{"e":"🦦🍦","de":"Danke, Mama! Das Eis ist lecker!","zh":"谢谢妈妈！冰淇淋真好吃！","py":"丹克，妈妈！达斯 艾斯 伊斯特 莱克尔！","a":"cd643d66f5.mp3"}]},"guide":{"teil":14,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-14-supermarkt/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-14-Supermarkt.pdf","story":"Rutschpartie im Supermarkt","storyZh":"超市里的滑溜溜大冒险","pages":"故事在 PDF 开头几页，后面是购物游戏和练习。","summary":["伊尔瓦变成了一盒牛奶，藏在超市冷藏柜里、鸡蛋旁边，偷偷看人们买东西。冷柜里好冷，她直打哆嗦。","一位爸爸带着两个女儿 Lisa 和 Nora 来买东西，手里拿着购物清单。姐妹俩想拿巧克力，爸爸说：先买鸡蛋！","两个人同时去抓鸡蛋盒，盒子掉在地上，鸡蛋全碎了。伊尔瓦心想：这下成了「炒鸡蛋」！爸爸让孩子们原地别动，他去找人帮忙。","伊尔瓦从冷柜里跳出来，变回原样。地上滑溜溜的，她提议一起玩「滑滑梯」，姐妹俩很想玩。","这时一位推着购物车、弯着腰的老奶奶走过来。伊尔瓦赶紧提醒她：小心，冷柜这边地滑！老奶奶谢谢孩子们。","爸爸带着超市理货员回来，把地上的鸡蛋清理干净。理货员夸孩子们会照顾别人，还说：出点小意外没关系。","爸爸说还要去面包区，然后去收银台付钱。姐妹俩挥手道别，伊尔瓦唱着歌蹦蹦跳跳地走了。"],"vocab":[{"de":"der Einkaufswagen","zh":"购物车","py":"戴尔 艾因考夫斯 瓦根","a":"9648783602.mp3"},{"de":"das Regal","zh":"货架","py":"达斯 雷加尔","a":"c65f6cc8b0.mp3"},{"de":"die Kassa","zh":"收银台（奥地利说法）","py":"迪 卡萨","a":"1d4c2efcc7.mp3"},{"de":"die Geldbörse","zh":"钱包","py":"迪 格尔特 伯尔泽","a":"0d04eb6a32.mp3"},{"de":"die Einkaufsliste","zh":"购物清单","py":"迪 艾因考夫斯 利斯特","a":"0e774040c9.mp3"},{"de":"die Lebensmittel","zh":"食品","py":"迪 莱本斯 米特尔","a":"aba312f456.mp3"},{"de":"die Obstabteilung","zh":"水果区","py":"迪 奥普斯特 阿普泰隆","a":"075f23084b.mp3"},{"de":"die Gemüseabteilung","zh":"蔬菜区","py":"迪 格米泽 阿普泰隆","a":"5bf1bdcd0f.mp3"},{"de":"die Backwaren","zh":"面包糕点","py":"迪 巴克 瓦伦","a":"270fc2af5d.mp3"},{"de":"das Kühlregal","zh":"冷藏柜","py":"达斯 屈尔 雷加尔","a":"54ac083069.mp3"},{"de":"die Süßwaren","zh":"糖果零食","py":"迪 聚斯 瓦伦","a":"f1eabe4211.mp3"},{"de":"die Eierspeise","zh":"炒鸡蛋（奥地利说法）","py":"迪 艾尔 施拜泽","a":"4b10741da4.mp3"},{"de":"schieben","zh":"推","py":"希本","a":"10511f2940.mp3"},{"de":"einkaufen","zh":"买东西","py":"艾因 考芬","a":"0b240a46f6.mp3"},{"de":"zurücklegen","zh":"放回去","py":"楚吕克 莱根","a":"cd9c4d3dd4.mp3"},{"de":"bezahlen","zh":"付钱","py":"贝察伦","a":"ab8526793d.mp3"},{"de":"auf","zh":"在……上面","py":"奥夫","a":"ddf835c91b.mp3"},{"de":"unter","zh":"在……下面","py":"温特尔","a":"6766177a04.mp3"},{"de":"neben","zh":"在……旁边","py":"内本","a":"fbf9b3bb9e.mp3"},{"de":"zwischen","zh":"在……中间","py":"茨维申","a":"4bd939ed2e.mp3"},{"de":"über","zh":"在……上方","py":"于贝尔","a":"fcd10c8088.mp3"},{"de":"zuerst","zh":"首先","py":"楚埃尔斯特","a":"dea8551b8c.mp3"},{"de":"dann","zh":"然后","py":"丹","a":"2cd3eb8290.mp3"},{"de":"nachher","zh":"之后","py":"纳赫赫尔","a":"60dd59e540.mp3"}],"grammar":[{"t":"先、再、然后：zuerst / dann / nachher","zh":"讲购物顺序。这些词放在句首时，动词仍然排第二。","ex":[{"de":"Zuerst brauchen wir Eier.","zh":"我们先要买鸡蛋。","py":"楚埃尔斯特 布劳亨 维尔 艾尔。","a":"63ca4a8ea0.mp3"},{"de":"Dann gehen wir zur Kassa.","zh":"然后我们去收银台。","py":"丹 盖恩 维尔 楚尔 卡萨。","a":"e2921bd6ae.mp3"}]},{"t":"没有：kein / keine","zh":"名词前说「没有」用 kein，阴性和复数用 keine。","ex":[{"de":"Es gibt keine Karotten.","zh":"没有胡萝卜了。","py":"埃斯 吉普特 凯讷 卡罗滕。","a":"dd97ce56bb.mp3"},{"de":"Wenn es keine Karotten gibt, kaufen wir Kartoffeln.","zh":"要是没有胡萝卜，我们就买土豆。","py":"文 埃斯 凯讷 卡罗滕 吉普特，考芬 维尔 卡尔托弗尔恩。","a":"32d29d829f.mp3"}]},{"t":"东西在哪儿：方位介词 + 3 格","zh":"说东西「在」哪儿，用 auf/unter/neben/zwischen/über + 第 3 格（der→dem，die→der，das→dem）。","ex":[{"de":"Der Saft steht neben dem Käse.","zh":"果汁在奶酪旁边。","py":"戴尔 扎夫特 施泰特 内本 登 凯泽。","a":"73c8b97e67.mp3"},{"de":"Die Zitronen liegen unter dem Mehl.","zh":"柠檬在面粉下面。","py":"迪 齐特罗嫩 利根 温特尔 登 梅尔。","a":"a70407e992.mp3"}]},{"t":"把东西放到哪儿：方位介词 + 4 格","zh":"有「放到……去」的动作时，用第 4 格（der→den，das 不变）。","ex":[{"de":"Wir legen die Kartoffeln in das Regal.","zh":"我们把土豆放进货架。","py":"维尔 莱根 迪 卡尔托弗尔恩 因 达斯 雷加尔。","a":"927876d5ea.mp3"}]},{"t":"我想要那个……：der / die 引导的从句","zh":"「旁边那瓶果汁」德语说成「那瓶果汁，它在奶酪旁边」，从句的动词放最后。Ich hätte gerne … 是礼貌地说「我想要」。","ex":[{"de":"Ich hätte gerne den Saft, der neben dem Käse steht.","zh":"我想要奶酪旁边那瓶果汁。","py":"伊希 黑特 格尔讷 登 扎夫特，戴尔 内本 登 凯泽 施泰特。","a":"065d289d47.mp3"}]}],"notes":["奥地利说法：收银台叫 die Kassa（德国说 die Kasse），炒鸡蛋叫 die Eierspeise（德国说 Rührei）。官方教材是奥地利的，所以用奥地利说法。"]}},{"id":"muellplatz","de":"Müllplatz","zh":"垃圾回收站","icon":"♻️","bg":["#e0f5e9","#e8f0ff"],"guide":{"teil":15,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-15-muellplatz/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-15-Muellplatz.pdf","story":"Mülli Müllmonster und die Müllmusik","storyZh":"垃圾怪兽和垃圾音乐","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦在公园的风铃草里休息，看到一群孩子两两排队往垃圾回收站走，就跳起来问他们去哪儿。","一个卷头发的男孩说：我们幼儿园收集并分好了垃圾，现在想去看看大的垃圾回收站是什么样。伊尔瓦很兴奋，也跟着去了。","到了回收站，老师 Bea 给大家介绍各种垃圾桶：黄色的放塑料和金属，旁边是厨余和废纸，两个玻璃回收桶分别放彩色玻璃和白玻璃。破垃圾袋发出臭味，苍蝇嗡嗡飞。","伊尔瓦看到桶外面扔了好多垃圾：瓶子、罐子、断了的木勺。她想象这里住着一个饿肚子的垃圾怪兽「Mülli」，也许大家只是不知道垃圾该放哪个桶。她决定和孩子们一起来打扫。","大部分孩子马上开始捡，只有 Jana 不愿意捡别人扔的东西。老师鼓励她：保持环境干净，自己也会觉得很舒服。伊尔瓦用旧勺子敲瓶子和罐子，唱起了打扫歌。","孩子们把垃圾分进对应的桶里。有个孩子问坏电视放哪儿，老师说放电子垃圾桶，还帮他一起抬过去。","伊尔瓦变成一把扫帚把地扫干净，大家鼓掌。Jana 说：Mülli 不会很快回来啦！"],"vocab":[{"de":"der Müll","zh":"垃圾","py":"戴尔 米尔","a":"8c0148226d.mp3"},{"de":"der Plastikmüll","zh":"塑料垃圾","py":"戴尔 普拉斯蒂克 米尔","a":"ecca5296c6.mp3"},{"de":"der Biomüll","zh":"厨余垃圾","py":"戴尔 比奥 米尔","a":"10268b54b0.mp3"},{"de":"das Altpapier","zh":"废纸","py":"达斯 阿尔特 帕皮尔","a":"ad1dc95fce.mp3"},{"de":"das Weißglas","zh":"白玻璃","py":"达斯 魏斯 格拉斯","a":"85a45d1f96.mp3"},{"de":"das Buntglas","zh":"彩色玻璃","py":"达斯 布恩特 格拉斯","a":"8e6dbac023.mp3"},{"de":"der Restmüll","zh":"其他垃圾","py":"戴尔 雷斯特 米尔","a":"1f9ba02824.mp3"},{"de":"der Elektromüll","zh":"电子垃圾","py":"戴尔 埃莱克特罗 米尔","a":"eca53b4e74.mp3"},{"de":"der Container","zh":"大垃圾箱","py":"戴尔 孔特纳","a":"a33be5dfb8.mp3"},{"de":"die Tonne","zh":"垃圾桶","py":"迪 托讷","a":"480bdd24ab.mp3"},{"de":"der Mistkübel","zh":"垃圾桶（奥地利说法）","py":"戴尔 米斯特 屈贝尔","a":"40ca9ab33b.mp3"},{"de":"trennen","zh":"分开","py":"特雷嫩","a":"cb830533bd.mp3"},{"de":"sortieren","zh":"分类","py":"佐尔蒂伦","a":"25be2b1999.mp3"},{"de":"wegwerfen","zh":"扔掉","py":"韦克 韦尔芬","a":"be6aa2b453.mp3"},{"de":"einsammeln","zh":"捡起来","py":"艾因 扎梅尔恩","a":"dfe133f637.mp3"},{"de":"schmutzig","zh":"脏","py":"施穆齐希","a":"7792870430.mp3"},{"de":"sauber","zh":"干净","py":"绍贝尔","a":"e4e4a99331.mp3"},{"de":"wohin","zh":"往哪儿","py":"沃欣","a":"60d1e21e97.mp3"}],"grammar":[{"t":"扔到哪儿：gehört in + 4 格","zh":"「该扔进……」用 in den / die / das（第 4 格）。问「放哪儿」用 wohin。","ex":[{"de":"Wohin gehört der Fernseher?","zh":"电视该放哪儿？","py":"沃欣 格赫尔特 戴尔 费恩泽尔？","a":"0ca4d3d60d.mp3"},{"de":"Er gehört in den Container für Elektromüll.","zh":"它该放进电子垃圾箱。","py":"埃尔 格赫尔特 因 登 孔特纳 菲尔 埃莱克特罗 米尔。","a":"c57e030105.mp3"}]},{"t":"不是：nicht","zh":"否定动作或说「不该放这里」用 nicht。","ex":[{"de":"Die Plastikflasche gehört nicht in die rote Tonne.","zh":"塑料瓶不该扔进红色的桶。","py":"迪 普拉斯蒂克 弗拉舍 格赫尔特 尼希特 因 迪 罗特 托讷。","a":"09b39c53f0.mp3"}]},{"t":"……的那个：der / die / das 从句","zh":"用 der/die/das 接一句话来说明前面的名词，动词放最后。","ex":[{"de":"Ich sammle den Müll ein, den andere weggeworfen haben.","zh":"我捡起别人扔掉的垃圾。","py":"伊希 扎姆勒 登 米尔 艾因，登 安德勒 韦克格沃尔芬 哈本。","a":"ca42ef3256.mp3"}]}],"notes":["奥地利说法：垃圾桶叫 der Mistkübel，垃圾回收站叫 der Mistplatz 或 Müllplatz。"]}},{"id":"verkehr","de":"Straßenverkehr","zh":"交通","icon":"🚦","bg":["#e6eef7","#fff0d9"],"guide":{"teil":16,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-16-strassenverkehr/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-16-Strassenverkehr.pdf","story":"Ilwa sieht grün","storyZh":"伊尔瓦看见绿灯","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["吃完早饭，伊尔瓦想看看城市的交通，就把自己变成一盏路灯，站在高处往下看。","她看到汽车、路面上画的线，还有好多行人。一辆有轨电车进站了，一个急匆匆的男人跑向公交站，一个骑车的男孩差点撞上他，及时刹住了车。","电车门开了，一位推婴儿车的女士下车。伊尔瓦变回原样，帮她把婴儿车抬下来，认识了她的儿子 Felix 和他的朋友 Elani。Elani 的爸爸妈妈上班很早，所以她跟着他们去幼儿园。","他们说：坐两站电车，然后走路过去。伊尔瓦问能不能一起去，他们说好。","到了人行横道，是红灯，大家在等。伊尔瓦心想：要是我是红绿灯就好了！她就变成了一盏行人信号灯，给行人亮起绿灯。","行人安全过马路，司机耐心等着。有一位坐轮椅的先生，伊尔瓦让绿灯多亮了一会儿，没有人按喇叭。最后她开开心心地和两个孩子道别。"],"vocab":[{"de":"der Straßenverkehr","zh":"道路交通","py":"戴尔 施特拉森 费尔克尔","a":"0d4f03f8b0.mp3"},{"de":"der Bus","zh":"公交车","py":"戴尔 布斯","a":"9c60f8f712.mp3"},{"de":"die Straßenbahn","zh":"有轨电车","py":"迪 施特拉森 班","a":"1006907957.mp3"},{"de":"die U-Bahn","zh":"地铁","py":"迪 乌 班","a":"b33cc03832.mp3"},{"de":"der Zug","zh":"火车","py":"戴尔 楚克","a":"232e3590ac.mp3"},{"de":"die Schnellbahn","zh":"城郊快铁","py":"迪 施内尔 班","a":"39aaf5c59b.mp3"},{"de":"das Auto","zh":"汽车","py":"达斯 奥托","a":"ca40e66f0e.mp3"},{"de":"das Fahrrad","zh":"自行车","py":"达斯 法尔 拉特","a":"6e4d293c55.mp3"},{"de":"der Roller","zh":"滑板车","py":"戴尔 罗勒尔","a":"749e360b9e.mp3"},{"de":"das Moped","zh":"轻便摩托","py":"达斯 莫佩特","a":"9ec1ca912b.mp3"},{"de":"der Stau","zh":"堵车","py":"戴尔 施陶","a":"e1274e5437.mp3"},{"de":"die Ampel","zh":"红绿灯","py":"迪 安佩尔","a":"d48fad9b23.mp3"},{"de":"die Haltestelle","zh":"车站","py":"迪 哈尔特 施特勒","a":"bbf616619c.mp3"},{"de":"einsteigen","zh":"上车","py":"艾因 施泰根","a":"782f00ca01.mp3"},{"de":"aussteigen","zh":"下车","py":"奥斯 施泰根","a":"71b19485e2.mp3"},{"de":"umsteigen","zh":"换乘","py":"乌姆 施泰根","a":"3ad8d568dc.mp3"},{"de":"fahren","zh":"坐车、开车","py":"法伦","a":"3672aacec1.mp3"},{"de":"gehen","zh":"走","py":"盖恩","a":"fb8a7fa519.mp3"},{"de":"warten","zh":"等","py":"瓦尔滕","a":"56d375d112.mp3"},{"de":"womit","zh":"用什么、坐什么","py":"沃米特","a":"d69fab99f1.mp3"}],"grammar":[{"t":"坐什么车：mit + 3 格","zh":"mit der Straßenbahn / mit dem Bus（第 3 格）。问「坐什么」用 womit。","ex":[{"de":"Womit fährst du?","zh":"你坐什么车？","py":"沃米特 费尔斯特 杜？","a":"c1492ad3f7.mp3"},{"de":"Ich fahre mit der Straßenbahn.","zh":"我坐有轨电车。","py":"伊希 法勒 米特 戴尔 施特拉森 班。","a":"3f000719f8.mp3"}]},{"t":"上车、下车：可分动词","zh":"einsteigen / aussteigen 拆开用：ein、aus 放最后。上车 in + 4 格，下车 aus + 3 格。","ex":[{"de":"Wir steigen in den Bus ein.","zh":"我们上公交车。","py":"维尔 施泰根 因 登 布斯 艾因。","a":"5a70b5c34f.mp3"},{"de":"Wir steigen aus dem Bus aus.","zh":"我们下公交车。","py":"维尔 施泰根 奥斯 登 布斯 奥斯。","a":"eb043b69cf.mp3"}]},{"t":"讲过去：ist gefahren / gegangen / gekommen","zh":"fahren、gehen、kommen 的过去时都用 sein。","ex":[{"de":"Ich bin mit dem Bus gefahren.","zh":"我是坐公交车来的。","py":"伊希 宾 米特 登 布斯 格法伦。","a":"097f029d3d.mp3"}]},{"t":"红绿灯规则","zh":"","ex":[{"de":"Rot heißt: Wir müssen warten.","zh":"红灯的意思是：我们得等。","py":"罗特 海斯特：维尔 米森 瓦尔滕。","a":"e1cce4bc38.mp3"},{"de":"Grün heißt: Wir dürfen gehen.","zh":"绿灯的意思是：我们可以走。","py":"格吕恩 海斯特：维尔 迪尔芬 盖恩。","a":"8e025a13a5.mp3"}]}],"notes":[]}},{"id":"post","de":"Post","zh":"邮局","icon":"📮","bg":["#fff3cc","#e6efff"],"guide":{"teil":17,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-17-post/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-17-Post.pdf","story":"Trari, trara! Das Postauto ist da","storyZh":"嘀嘀嗒！邮车来啦","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦吹着口哨走在人行道上，数着一栋公寓楼有四层，这时一辆黄色的邮车停下了。","邮递员 Ellie 打开车厢，里面装满了包裹、信和明信片。伊尔瓦探头去看，Ellie 笑着问是谁在偷看。伊尔瓦说要帮忙：两个人一起快一倍！","Ellie 给她一个写着「易碎」的小包裹，送给二楼的 Meyer 太太。老太太猜里面是她订的新茶杯。","她们一层一层地送包裹，有的包裹特别重，伊尔瓦送得好累。四楼没人开门，Ellie 写了一张取件通知，包裹只好又搬下楼。","接着她们把信和广告分进各家信箱。伊尔瓦看到一个画着心的信封，想打开看看，Ellie 说：信只能收信人自己拆，这叫通信秘密。","8 号信箱塞满了，伊尔瓦就用魔法袜子变成一只紫色鸽子，把信从四楼开着的窗户送了进去。看着邮车开走，她希望自己哪天也能收到一封信。"],"vocab":[{"de":"die Post","zh":"邮局；邮件","py":"迪 波斯特","a":"d863df0645.mp3"},{"de":"das Paket","zh":"包裹","py":"达斯 帕凯特","a":"0a65c54eb3.mp3"},{"de":"der Brief","zh":"信","py":"戴尔 布里夫","a":"87058fbed6.mp3"},{"de":"das Kuvert","zh":"信封（奥地利说法）","py":"达斯 库韦尔","a":"bcfb215388.mp3"},{"de":"die Briefmarke","zh":"邮票","py":"迪 布里夫 马尔克","a":"0507bc0905.mp3"},{"de":"das Postauto","zh":"邮车","py":"达斯 波斯特 奥托","a":"f86b2839ed.mp3"},{"de":"die Briefträgerin","zh":"女邮递员","py":"迪 布里夫 特雷格林","a":"0ab5f90e93.mp3"},{"de":"der Briefkasten","zh":"信箱","py":"戴尔 布里夫 卡斯滕","a":"134d273453.mp3"},{"de":"die Postkarte","zh":"明信片","py":"迪 波斯特 卡尔特","a":"bc4ec8160d.mp3"},{"de":"die Einladung","zh":"请柬","py":"迪 艾因 拉东","a":"7b6bd68ec0.mp3"},{"de":"die Werbung","zh":"广告","py":"迪 韦尔本","a":"8b2e43fe32.mp3"},{"de":"der Empfänger","zh":"收件人","py":"戴尔 恩普芬格尔","a":"a3111af7f2.mp3"},{"de":"der Absender","zh":"寄件人","py":"戴尔 阿普 森德尔","a":"6fa8fde9af.mp3"},{"de":"schicken","zh":"寄","py":"希肯","a":"4410424b0a.mp3"},{"de":"bekommen","zh":"收到","py":"贝科门","a":"870acc20dd.mp3"},{"de":"aufmachen","zh":"打开","py":"奥夫 马亨","a":"1e621efa9c.mp3"},{"de":"verpacken","zh":"包装","py":"费尔 帕肯","a":"42420c3f26.mp3"},{"de":"gehören","zh":"属于","py":"格赫伦","a":"09131a83cc.mp3"},{"de":"glauben","zh":"认为、猜","py":"格劳本","a":"9f0b417ed8.mp3"},{"de":"schwer","zh":"重","py":"施维尔","a":"98a0407ec2.mp3"},{"de":"leicht","zh":"轻","py":"莱希特","a":"3c371aa8bd.mp3"},{"de":"zerbrechlich","zh":"易碎","py":"采尔布雷希利希","a":"1c2fba6a6d.mp3"},{"de":"kaputt","zh":"坏了","py":"卡普特","a":"088ee79fcc.mp3"}],"grammar":[{"t":"这是谁的：gehört mir / dir","zh":"gehören 后面用第 3 格：mir（我）、dir（你）。","ex":[{"de":"Das Paket gehört nicht mir. Gehört es dir?","zh":"这个包裹不是我的。是你的吗？","py":"达斯 帕凯特 格赫尔特 尼希特 米尔。格赫尔特 埃斯 迪尔？","a":"ff46d3d5ef.mp3"}]},{"t":"我的、你的：mein / dein","zh":"mein＝我的，dein＝你的；阴性名词加 -e。","ex":[{"de":"Das ist mein Paket, weil mein Name darauf steht.","zh":"这是我的包裹，因为上面写着我的名字。","py":"达斯 伊斯特 迈因 帕凯特，魏尔 迈因 纳默 达劳夫 施泰特。","a":"8313848883.mp3"}]},{"t":"我猜：Ich glaube, dass …","zh":"dass 小句动词放最后。","ex":[{"de":"Ich glaube, dass da ein Seil drin ist.","zh":"我猜里面是一根绳子。","py":"伊希 格劳贝，达斯 达 艾因 赛尔 德林 伊斯特。","a":"43e431f45d.mp3"}]},{"t":"一起更快","zh":"","ex":[{"de":"Gemeinsam sind wir doppelt so schnell!","zh":"我们一起就快一倍！","py":"格迈因扎姆 津特 维尔 多佩尔特 佐 施内尔！","a":"5209de9906.mp3"}]}],"notes":["奥地利说法：信封叫 das Kuvert，邮递员口语叫 der Postler，信箱叫 das Postkasterl。"]}},{"id":"aufraeumen","de":"Aufräumen","zh":"收拾房间","icon":"🧹","bg":["#e9f4ff","#f5ead9"],"guide":{"teil":18,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-18-aufraeumen/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-18-Aufraeumen.pdf","story":"Fatih räumt auf","storyZh":"Fatih 收拾房间","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦去 Fatih 家玩，一下扑到他床上：床上堆着靠垫、袜子、点心盒、宝石、绘本和幼儿园书包。Fatih 骄傲地说：九月我就要上学了！","两个人打起了枕头仗，玩具扔得满屋都是。奶奶端着饼干进来，提醒 Fatih 待会儿要收拾房间。Fatih 翻了个白眼，他不喜欢收拾。","伊尔瓦问他知不知道东西都该放哪儿。Fatih 说：积木放红箱子，弹珠放小盒子，衣服放衣柜或者五斗柜。伊尔瓦提议把收拾变成游戏，Fatih 不信收拾也能好玩。","伊尔瓦用魔法袜子把自己变成一台小黄挖掘机。Fatih 开着她在屋里转，把乐高和木头积木铲进对的箱子里，又把衣服分进洗衣篮或衣柜。","分衣服的时候，Fatih 发现旧的蓝 T 恤和旧魔术帽已经用不上了，决定送给别人。伊尔瓦说：送人是个好主意！","他们把笔收进笔袋，书包放到桌子底下，纸和剪刀放进抽屉，涂色本放上书架，宝石和硬币放进小盒子，最后铺平床单、摆好靠垫和毛绒玩具、叠好毯子。","爷爷来了，惊讶房间这么整齐。Fatih 骄傲地说：收拾房间挺好玩的！"],"vocab":[{"de":"aufräumen","zh":"收拾","py":"奥夫 罗伊门","a":"a4ff4100c7.mp3"},{"de":"einsammeln","zh":"收集起来","py":"艾因 扎梅尔恩","a":"dfe133f637.mp3"},{"de":"gehören","zh":"该放在","py":"格赫伦","a":"09131a83cc.mp3"},{"de":"schenken","zh":"送人","py":"申肯","a":"27221e7cb1.mp3"},{"de":"passen","zh":"合身","py":"帕森","a":"6c1523109c.mp3"},{"de":"der Kleiderschrank","zh":"衣柜","py":"戴尔 克莱德尔 施兰克","a":"3fd4917411.mp3"},{"de":"die Kommode","zh":"五斗柜","py":"迪 科莫德","a":"afc6cb0bd3.mp3"},{"de":"die Lade","zh":"抽屉（奥地利说法）","py":"迪 拉德","a":"8016744040.mp3"},{"de":"die Kiste","zh":"箱子","py":"迪 基斯特","a":"454bcd82d7.mp3"},{"de":"das Bücherregal","zh":"书架","py":"达斯 比歇尔 雷加尔","a":"9b158863ce.mp3"},{"de":"das Bett","zh":"床","py":"达斯 贝特","a":"3512c331ba.mp3"},{"de":"der Sessel","zh":"椅子（奥地利说法）","py":"戴尔 塞塞尔","a":"f18a88d454.mp3"},{"de":"die Hose","zh":"裤子","py":"迪 霍泽","a":"70e2875656.mp3"},{"de":"der Pullover","zh":"毛衣","py":"戴尔 普洛弗尔","a":"ad878f64cf.mp3"},{"de":"die Socken","zh":"袜子","py":"迪 佐肯","a":"df6e524150.mp3"},{"de":"die Bausteine","zh":"积木","py":"迪 鲍 施泰讷","a":"4e4f84e011.mp3"},{"de":"die Murmeln","zh":"弹珠","py":"迪 穆尔梅尔恩","a":"930fb79bdd.mp3"},{"de":"das Kuscheltier","zh":"毛绒玩具","py":"达斯 库舍尔 蒂尔","a":"e4b44f55eb.mp3"},{"de":"die Schultasche","zh":"书包","py":"迪 舒尔 塔舍","a":"aa26b1b40e.mp3"},{"de":"das Federpennal","zh":"笔袋（奥地利说法）","py":"达斯 费德尔 佩纳尔","a":"9272359aea.mp3"},{"de":"die Decke","zh":"毯子","py":"迪 德克","a":"f455e3c3a9.mp3"},{"de":"wohin","zh":"放哪儿","py":"沃欣","a":"60d1e21e97.mp3"}],"grammar":[{"t":"放到哪儿：in / auf + 4 格","zh":"有「放进去」的动作，用第 4 格：in den Schrank，auf das Regal。","ex":[{"de":"Die Socken gehören in die Kommode.","zh":"袜子该放进五斗柜。","py":"迪 佐肯 格赫伦 因 迪 科莫德。","a":"56abdbde1b.mp3"},{"de":"Die Bausteine kommen in die rote Kiste.","zh":"积木放进红箱子。","py":"迪 鲍 施泰讷 科门 因 迪 罗特 基斯特。","a":"0313e5cbcc.mp3"}]},{"t":"可分动词 aufräumen","zh":"拆开用：räume 排第二，auf 放最后。","ex":[{"de":"Ich räume mein Zimmer auf.","zh":"我收拾我的房间。","py":"伊希 罗伊默 迈因 齐默尔 奥夫。","a":"dfa9eb06c9.mp3"},{"de":"Wohin räumst du den Baustein?","zh":"你把积木放哪儿？","py":"沃欣 罗伊姆斯特 杜 登 鲍 施泰因？","a":"b4ca2448a5.mp3"}]},{"t":"并排、叠起来：nebeneinander / übereinander","zh":"nebeneinander＝一个挨一个，übereinander＝一个叠一个。","ex":[{"de":"Leg die Socken übereinander!","zh":"把袜子叠在一起放！","py":"莱克 迪 佐肯 于贝尔 艾南德尔！","a":"3ab1f21a3e.mp3"},{"de":"Setz die Kuscheltiere nebeneinander!","zh":"把毛绒玩具并排放好！","py":"泽茨 迪 库舍尔 蒂勒 内本 艾南德尔！","a":"6d2dca92d6.mp3"}]}],"notes":["奥地利说法：抽屉叫 die Lade，椅子叫 der Sessel（在德国 Sessel 是扶手沙发），笔袋叫 das Federpennal。"]}},{"id":"gefuehle","de":"Gefühle","zh":"心情","icon":"😊","bg":["#ffe6ea","#fff6d6"],"guide":{"teil":19,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-19-gefuehle/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-19-Gefuehle.pdf","story":"Ich fühle was, was du nicht fühlst","storyZh":"我感觉到你感觉不到的","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["Kilian 又饿又渴，抱怨午饭还没好，弟弟也一样。妈妈说：别闹了，来帮忙摆桌子。来做客的伊尔瓦也来帮忙。","Nada 阿姨和 Malik 叔叔带着小宝宝 Malena 来了，全家都挤到门口看宝宝。Malena 哭了，叔叔给她喂奶，因为她又饿又困。","大家坐在客厅，阿姨抱着睡着的宝宝讲蜜月旅行。Kilian 小声跟伊尔瓦说：他们总在讲爱情。然后他提议用木头积木搭塔。","Kilian 搭了一座很高的塔，叔叔也来搭。Kilian 放最后一块的时候，塔晃了晃，倒了。大家都看着他，伊尔瓦问他还好吗。","爸爸递给他纸巾，妈妈说：换了我也会生气。哥哥说：好丢脸。姐姐猜他是嫉妒，想去推倒叔叔的塔。爷爷开玩笑说：有人就是累了。奶奶小声对他说：不用在意别人怎么想。","Kilian 又高兴起来：塔倒了正好，可以搭一座更高的！这次塔稳稳地立住了，大家都很开心。伊尔瓦变成塔顶，唱起她最爱的歌。"],"vocab":[{"de":"das Gefühl","zh":"感觉、情绪","py":"达斯 格菲尔","a":"f13f8697a8.mp3"},{"de":"hungrig","zh":"饿","py":"洪格里希","a":"280e0d6c8f.mp3"},{"de":"durstig","zh":"渴","py":"杜尔斯蒂希","a":"6fa2fc5948.mp3"},{"de":"müde","zh":"困、累","py":"米德","a":"9e70b3dc2a.mp3"},{"de":"fröhlich","zh":"开心","py":"弗勒利希","a":"f18dd83d03.mp3"},{"de":"traurig","zh":"难过","py":"特劳里希","a":"fd0727bcab.mp3"},{"de":"wütend","zh":"生气","py":"维滕特","a":"34ec4ac74a.mp3"},{"de":"ängstlich","zh":"害怕","py":"恩斯特利希","a":"8ee108c06c.mp3"},{"de":"aufgeregt","zh":"激动、紧张","py":"奥夫格雷克特","a":"0cec5c42a1.mp3"},{"de":"verliebt","zh":"恋爱中","py":"费尔利普特","a":"78c3c33da7.mp3"},{"de":"einsam","zh":"孤单","py":"艾因扎姆","a":"825e209c2d.mp3"},{"de":"peinlich","zh":"丢脸、尴尬","py":"派因利希","a":"56d0358d9d.mp3"},{"de":"neidisch","zh":"嫉妒","py":"奈迪施","a":"3363563055.mp3"},{"de":"weinen","zh":"哭","py":"魏嫩","a":"8aa7976c46.mp3"},{"de":"sich freuen","zh":"高兴","py":"齐希 弗罗伊恩","a":"54e3286b71.mp3"},{"de":"sich fürchten","zh":"害怕","py":"齐希 菲尔希滕","a":"051dcdf649.mp3"},{"de":"schreien","zh":"喊叫","py":"施赖恩","a":"7d33c553b0.mp3"},{"de":"sich fühlen","zh":"感觉","py":"齐希 菲伦","a":"0a7774c5c6.mp3"},{"de":"der Hunger","zh":"饥饿","py":"戴尔 洪格尔","a":"7f8d743208.mp3"},{"de":"der Durst","zh":"口渴","py":"戴尔 杜尔斯特","a":"15da439da5.mp3"},{"de":"die Angst","zh":"害怕","py":"迪 昂斯特","a":"ee4695343e.mp3"},{"de":"die Wut","zh":"怒气","py":"迪 武特","a":"2e4e8887c1.mp3"},{"de":"die Liebe","zh":"爱","py":"迪 利贝","a":"7c7fbf7a72.mp3"},{"de":"die Langeweile","zh":"无聊","py":"迪 朗厄 魏勒","a":"481639e19c.mp3"}],"grammar":[{"t":"说心情：Ich bin … / Ich habe …","zh":"形容词用 Ich bin（Ich bin müde）；名词用 Ich habe（Ich habe Hunger）。","ex":[{"de":"Ich bin so hungrig!","zh":"我好饿！","py":"伊希 宾 佐 洪格里希！","a":"5c2cfd42d8.mp3"},{"de":"Ich habe Durst.","zh":"我渴了。","py":"伊希 哈贝 杜尔斯特。","a":"0d21ee3cb0.mp3"}]},{"t":"心情和动作：traurig – weinen","zh":"难过就哭，开心就笑：把感觉和动作连起来说。","ex":[{"de":"Wenn ich traurig bin, weine ich.","zh":"我难过的时候会哭。","py":"文 伊希 特劳里希 宾，魏讷 伊希。","a":"c888358e5e.mp3"},{"de":"Wenn du weinen musst, hier ist ein Taschentuch.","zh":"要是你想哭，这儿有纸巾。","py":"文 杜 魏嫩 穆斯特，希尔 伊斯特 艾因 塔申 图赫。","a":"fdcdee7b39.mp3"}]},{"t":"不……而是……：statt zu …","zh":"statt zu + 动词原形＝「不去……」，后面说更好的做法。","ex":[{"de":"Statt zu brüllen, sage ich: Das macht mich wütend!","zh":"我不大吼，而是说：这让我很生气！","py":"施塔特 楚 布吕伦，扎格 伊希：达斯 马赫特 米希 维滕特！","a":"9085ab34c0.mp3"}]},{"t":"形容词变名词：traurig → die Traurigkeit","zh":"很多形容词加 -keit 变成名词，都是 die。","ex":[{"de":"Die Traurigkeit geht vorbei.","zh":"难过会过去的。","py":"迪 特劳里希凯特 盖特 福尔拜。","a":"5c4eb319d2.mp3"}]}],"notes":["奥地利说法：嫉妒常说 neidig（德国说 neidisch）。"]}},{"id":"bad","de":"Badezimmer","zh":"浴室","icon":"🛁","bg":["#dff4ff","#e9e3ff"],"guide":{"teil":20,"url":"https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/teil-20-badezimmer/","pdf":"https://sprachportal.at/fileadmin/user_upload/meinsprachportal-at/Ilwa/pdf/Teil-20-Badezimmer.pdf","story":"Auf zur Schaumparty","storyZh":"泡泡派对出发","pages":"故事在 PDF 开头几页，后面是给老师的游戏和练习。","summary":["伊尔瓦在 Aya 家过夜，看到 Aya 家的大浴缸高兴极了，在水里扑腾个不停。","两个女孩玩起了泡泡肥皂。伊尔瓦学 Aya 往胳膊和身上抹肥皂，发现自己的脚指甲脏了，Aya 递给她指甲刷，她把指甲刷得干干净净。","伊尔瓦的头发打结了，她们开始洗头。平时是 Aya 的爸爸帮她洗，今晚伊尔瓦来帮。Aya 用毛巾捂住眼睛，伊尔瓦先冲水，再抹洗发水，再冲干净。","伊尔瓦用魔法袜子变成一个喷泉，喷出数不清的泡泡。Aya 用泡沫给自己做了长胡子和浓眉毛，两人笑个不停。","水凉了，她们从浴缸出来，用浴巾擦干，互相吹头发。伊尔瓦试了架子上的面霜，皮肤变得软软的。","刷完牙，换上睡衣，上床。Aya 的爸爸跟她们说晚安。伊尔瓦说：我觉得被照顾得好好的，干干净净，好开心。"],"vocab":[{"de":"das Badezimmer","zh":"浴室","py":"达斯 巴德 齐默尔","a":"76465225d3.mp3"},{"de":"die Haare","zh":"头发","py":"迪 哈勒","a":"d93ca3e5ae.mp3"},{"de":"die Zähne","zh":"牙齿","py":"迪 采讷","a":"4b86e1445f.mp3"},{"de":"das Gesicht","zh":"脸","py":"达斯 格齐希特","a":"96f781361e.mp3"},{"de":"die Hände","zh":"手","py":"迪 亨德","a":"df8248969f.mp3"},{"de":"die Nase","zh":"鼻子","py":"迪 纳泽","a":"72a10a05db.mp3"},{"de":"die Nägel","zh":"指甲","py":"迪 内格尔","a":"aeeab7a56a.mp3"},{"de":"der Waschlappen","zh":"洗澡巾","py":"戴尔 瓦施 拉喷","a":"0abf947714.mp3"},{"de":"das Handtuch","zh":"毛巾","py":"达斯 汉特 图赫","a":"86330ab6b0.mp3"},{"de":"die Zahnbürste","zh":"牙刷","py":"迪 灿 比尔斯特","a":"331609ad76.mp3"},{"de":"die Zahnpasta","zh":"牙膏","py":"迪 灿 帕斯塔","a":"8033899dcc.mp3"},{"de":"das Shampoo","zh":"洗发水","py":"达斯 尚普","a":"c3cd2a2aa8.mp3"},{"de":"der Kamm","zh":"梳子","py":"戴尔 卡姆","a":"046f3da9a3.mp3"},{"de":"der Föhn","zh":"吹风机","py":"戴尔 弗恩","a":"fb1f99591d.mp3"},{"de":"waschen","zh":"洗","py":"瓦申","a":"220e9052e1.mp3"},{"de":"putzen","zh":"刷、清洁","py":"普岑","a":"dbb52052ec.mp3"},{"de":"duschen","zh":"淋浴","py":"杜申","a":"a5ce9ccd9c.mp3"},{"de":"föhnen","zh":"吹干","py":"弗嫩","a":"2d72cda323.mp3"},{"de":"abtrocknen","zh":"擦干","py":"阿普 特罗克嫩","a":"59747ac3f8.mp3"},{"de":"eincremen","zh":"抹霜","py":"艾因 克雷门","a":"5140a52a47.mp3"},{"de":"sauber","zh":"干净","py":"绍贝尔","a":"e4e4a99331.mp3"},{"de":"schmutzig","zh":"脏","py":"施穆齐希","a":"7792870430.mp3"},{"de":"nass","zh":"湿","py":"纳斯","a":"0f64eab7c4.mp3"},{"de":"trocken","zh":"干","py":"特罗肯","a":"5196464529.mp3"},{"de":"weich","zh":"软","py":"魏希","a":"1552df800d.mp3"}],"grammar":[{"t":"我的、我们的：mein / unser","zh":"mein＝我的，unser＝我们的；复数加 -e：meine Zähne。","ex":[{"de":"Ich putze meine Zähne.","zh":"我刷牙。","py":"伊希 普策 迈讷 采讷。","a":"ad4cba449e.mp3"},{"de":"Wir waschen unser Gesicht.","zh":"我们洗脸。","py":"维尔 瓦申 翁泽尔 格齐希特。","a":"f7b4ae39e5.mp3"}]},{"t":"为了……：damit","zh":"damit 说目的，动词放最后。","ex":[{"de":"Ich putze meine Zähne, damit sie sauber sind.","zh":"我刷牙，好让牙齿干净。","py":"伊希 普策 迈讷 采讷，达米特 齐 绍贝尔 津特。","a":"1bf1cbbb84.mp3"}]},{"t":"因为：weil","zh":"weil 说原因，动词放最后。","ex":[{"de":"Ich föhne meine Haare, weil sie nass sind.","zh":"我吹头发，因为头发是湿的。","py":"伊希 弗讷 迈讷 哈勒，魏尔 齐 纳斯 津特。","a":"2a927b7b48.mp3"}]},{"t":"用什么：mit + 3 格","zh":"","ex":[{"de":"Ich kämme mich mit dem Kamm.","zh":"我用梳子梳头。","py":"伊希 凯默 米希 米特 登 卡姆。","a":"a455651ec4.mp3"}]}],"notes":["官方练习里有几句是故意写错的句子，让孩子找错，比如「我剪指甲，好让它变长」。看到不通的句子别担心。","奥地利说法：指甲钳叫 der Nagelzwicker。"]}}];

const au=new Audio();au.preload='auto';
let chain=null; // 当前连播序列的作废标记
function play(files,btn){
  const my=chain={};
  document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));
  if(btn)btn.classList.add('playing');
  return new Promise(res=>{
    let i=0;
    const next=()=>{
      if(chain!==my)return res(false);
      if(i>=files.length){if(btn)btn.classList.remove('playing');return res(true);}
      au.src='audio/'+files[i++];
      au.onended=next;au.onerror=next;
      au.play().catch(()=>{if(btn)btn.classList.remove('playing');res(false);});
    };
    next();
  });
}
function stop(){chain=null;au.pause();document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));}

const emo=it=>it.n>1?'<span class="many">'+it.e.repeat(it.n)+'</span>':it.e;
const word=it=>it.art?'<span class="art-'+it.art+'">'+it.art+' '+esc(it.de)+'</span>':esc(it.de);
const bg=t=>'background:linear-gradient(135deg,'+t.bg[0]+','+t.bg[1]+')';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

function home(){
  stop();
  document.title='儿童德语：跟小獭 Otti 学德语（中德双语）| 德语学习手册';
  app.innerHTML='<div class="top"><a class="back" href="/">← 手册</a><h1>🧒 儿童德语<small>跟小獭 Otti 学德语 · 中德双语</small></h1></div>'
   +'<div class="hero"><img src="otti.webp" alt="小獭 Otti" width="84" height="113"><div><p lang="de"><b>Hallo! Ich bin Otti.</b></p><p>你好！我是小獭奥蒂。选一个主题，点图听德语、看故事、玩游戏吧！</p><div class="say">按奥地利官方儿童课程 Ilwa 的 20 课排列。每课有「官方课」中文伴读：打开官方原版教材，配着中文梗概、生词和语法讲解一起学。</div></div></div>'
   +'<div class="grid">'+ALL.map(([id,de,zh,ic,slug],k)=>{
      const t=THEMES.find(x=>x.id===id);
      return t?'<button class="tcard" style="'+bg(t)+'" onclick="location.hash=\''+id+'\'"><div class="ic">'+ic+'</div><b lang="de">'+de+'</b><span>第 '+(k+1)+' 课 · '+zh+'</span></button>'
              :'<a class="tcard soon" href="'+OIF+slug+'/"><div class="ic">'+ic+'</div><b lang="de">'+de+'</b><span>第 '+(k+1)+' 课 · '+zh+'<br></span></a>';
    }).join('')+'</div>'
   +foot();
}
function foot(){
  return '<div class="foot">主题参照奥地利融合基金会（ÖIF）儿童德语课程「Ilwa Immerfroh」的 20 个场景，本页词句、故事和配音均为本站原创。想用官方原版：'
   +'<a href="https://sprachportal.at/deutsch-fuer-kinder/deutsch-lernen-mit-ilwa/" target="_blank" rel="noopener">ÖIF Sprachportal · Ilwa</a>（官方 App「ILWA」免费，全德语）。'
   +'<br>德语配音：Thorsten-Voice（CC0），由 Piper 离线合成。</div>';
}

function theme(id,tab){
  const t=THEMES.find(x=>x.id===id);if(!t)return home();
  stop();
  document.title=t.zh+'（'+t.de+'）· 儿童德语 | 德语学习手册';
  tab=tab||(t.guide?'guide':'look');
  const tabs=(t.guide?[['guide','📘 官方课']]:[]).concat(t.items?[['look','🔍 看图'],['story','📖 故事'],['game','🎮 游戏']]:[]);
  if(!tabs.some(x=>x[0]===tab))tab=tabs[0][0];
  app.innerHTML='<div class="top"><button class="back" onclick="location.hash=\'\'">← 主题</button><h1>'+t.icon+' <span lang="de">'+t.de+'</span><small>'+t.zh+'</small></h1></div>'
   +(tabs.length<2?'':'<div class="tabs" role="tablist">'+tabs.map(([k,l])=>'<button role="tab" aria-selected="'+(k===tab)+'" onclick="location.hash=\''+id+'/'+k+'\'">'+l+'</button>').join('')+'</div>')
   +'<div id="pane"></div>'+foot();
  ({guide,look,story,game})[tab](t,$('#pane'));
}

// 官方教材伴读：只放链接 + 自己写的中文讲解（ÖIF 原文不复制）
function guide(t,el){
  const g=t.guide,spk=(a,label)=>'<button class="spk" data-a="'+a+'" aria-label="朗读：'+esc(label)+'">🔊</button>';
  el.innerHTML='<div class="oif"><div class="oif-h">📘 官方第 '+g.teil+' 课 · <span lang="de">'+esc(g.story)+'</span><small>'+esc(g.storyZh)+'</small></div>'
   +(g.pdf?'<a class="btn oif-btn" href="'+g.pdf+'">📄 打开官方教材 PDF</a><a class="oif-link" href="'+g.url+'">官方本课网页</a>'
         :'<a class="btn oif-btn" href="'+g.url+'">🌐 打开官方本课网页</a>')
   +'<div class="py" style="margin-top:8px">'+esc(g.pages)+'看完点浏览器的 ← 返回，就回到这里。</div></div>'
   +(g.summary.length?'<h2 class="gh">📖 故事讲了什么</h2><ol class="sum">'+g.summary.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'')
   +'<h2 class="gh">🔤 本课生词</h2><div class="voc">'+g.vocab.map(v=>{
      const m=/^(der|die|das) (.+)$/.exec(v.de);
      const w=m?'<span class="art-'+m[1]+'">'+m[1]+' '+esc(m[2])+'</span>':esc(v.de);
      return '<div class="vrow"><div style="flex:1;min-width:0"><b lang="de">'+w+'</b> <span>'+esc(v.zh)+'</span><div class="py">'+esc(v.py)+'</div></div>'+spk(v.a,v.de)+'</div>';
    }).join('')+'</div>'
   +'<h2 class="gh">🧩 语法点</h2>'+g.grammar.map(gr=>'<div class="gcard"><b>'+esc(gr.t)+'</b>'+(gr.zh?'<p>'+esc(gr.zh)+'</p>':'')
      +gr.ex.map(x=>'<div class="vrow"><div style="flex:1;min-width:0"><div class="de" lang="de">'+esc(x.de)+'</div><div>'+esc(x.zh)+'</div><div class="py">'+esc(x.py)+'</div></div>'+spk(x.a,x.de)+'</div>').join('')+'</div>').join('')
   +(g.notes&&g.notes.length?'<h2 class="gh">💡 小提示</h2>'+g.notes.map(n=>'<div class="tip">'+esc(n)+'</div>').join(''):'');
  el.querySelectorAll('.spk[data-a]').forEach(b=>b.onclick=()=>play([b.dataset.a],b));
}

function look(t,el){
  el.innerHTML='<div class="tip">👆 点一点图里的东西，听它用德语怎么说。<br>'+esc(t.focus)+'</div>'
   +'<div class="scene" style="'+bg(t)+'">'+t.items.map((it,i)=>'<button class="obj" data-i="'+i+'" aria-label="'+esc(it.zh)+'">'+emo(it)+'</button>').join('')+'</div>'
   +'<div class="card" id="card"></div>';
  el.querySelectorAll('.obj').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('.obj.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const it=t.items[+b.dataset.i],c=$('#card');
    c.className='card show';
    c.innerHTML='<div class="row"><div class="big">'+emo(it)+'</div><div style="flex:1;min-width:0"><div class="w" lang="de">'+word(it)+'</div><div class="zh">'+esc(it.zh)+'</div><div class="py">谐音：'+esc(it.py)+'</div></div><button class="spk" id="sw" aria-label="朗读单词">🔊</button></div>'
     +'<div class="sent"><div style="flex:1;min-width:0"><div class="de" lang="de">'+esc(it.s)+'</div><div class="zh">'+esc(it.sz)+'</div><div class="py">谐音：'+esc(it.sp)+'</div></div><button class="spk" id="ss" aria-label="朗读句子">🔊</button></div>';
    $('#sw').onclick=()=>play([it.wa],$('#sw'));
    $('#ss').onclick=()=>play([it.sa],$('#ss'));
    play([it.wa,it.sa]);
  });
}

function story(t,el){
  const L=t.story.lines;let cur=0,auto=false;
  const showPy=lsGet('kinder_py','1')==='1';
  el.innerHTML='<div class="tip">📺 '+esc(t.story.zh)+'（<span lang="de">'+esc(t.story.de)+'</span>）—— 按 ▶ 连着听，字幕上面德语、下面中文。</div>'
   +'<div class="screen" style="'+bg(t)+'"><div class="pic" id="pic"></div><div class="subs"><div class="sd" lang="de" id="sd"></div><div class="sz" id="sz"></div><div class="sp" id="spy"></div></div></div>'
   +'<div class="ctrl"><button id="prev" aria-label="上一句">⏮</button><button class="main" id="pp">▶ 播放</button><button id="nxt" aria-label="下一句">⏭</button></div>'
   +'<div class="ctrl"><label><input type="checkbox" id="pyt"'+(showPy?' checked':'')+'> 显示谐音</label></div>'
   +'<ol class="lines">'+L.map((l,i)=>'<li data-i="'+i+'"><span class="n">'+l.e+'</span><div><div class="de" lang="de">'+esc(l.de)+'</div><div class="zh">'+esc(l.zh)+'</div></div></li>').join('')+'</ol>';
  const pp=$('#pp'),pyt=$('#pyt');
  const show=i=>{
    cur=i;const l=L[i],p=$('#pic');
    p.textContent=l.e;p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');
    $('#sd').textContent=l.de;$('#sz').textContent=l.zh;$('#spy').textContent=l.py;$('#spy').hidden=!pyt.checked;
    el.querySelectorAll('.lines li').forEach((li,k)=>li.classList.toggle('cur',k===i));
  };
  const setAuto=v=>{auto=v;pp.textContent=v?'⏸ 暂停':(cur>=L.length-1?'↺ 再听一遍':'▶ 播放');};
  const run=async i=>{
    show(i);
    const done=await play([L[i].a]);
    if(!done)return;
    if(auto&&i<L.length-1){setTimeout(()=>{if(auto&&cur===i)run(i+1)},500);}
    else setAuto(false);
  };
  pp.onclick=()=>{
    if(auto){stop();setAuto(false);return;}
    const again=pp.textContent.indexOf('↺')===0;setAuto(true);run(again?0:cur);
  };
  $('#prev').onclick=()=>{setAuto(false);run(Math.max(0,cur-1));};
  $('#nxt').onclick=()=>{setAuto(false);run(Math.min(L.length-1,cur+1));};
  el.querySelectorAll('.lines li').forEach(li=>li.onclick=()=>{setAuto(false);run(+li.dataset.i);});
  pyt.onchange=()=>{lsSet('kinder_py',pyt.checked?'1':'0');$('#spy').hidden=!pyt.checked;};
  show(0);
}

function game(t,el){
  const ROUNDS=6;let round=0,score=0,qs=shuffle(t.items.slice()).slice(0,ROUNDS);
  const ask=()=>{
    if(round>=qs.length){
      el.innerHTML='<div class="game"><div class="done">'+'⭐'.repeat(score)+'<br><span lang="de">'+(score===qs.length?'Super!':'Gut gemacht!')+'</span> 答对 '+score+' / '+qs.length+'</div><button class="btn" id="again">再玩一次</button></div>';
      $('#again').onclick=()=>game(t,el);
      return;
    }
    const it=qs[round];
    const opts=shuffle([it].concat(shuffle(t.items.filter(x=>x!==it)).slice(0,3)));
    el.innerHTML='<div class="game"><div class="stars" aria-label="第 '+(round+1)+' 题">'+'⭐'.repeat(score)+'☆'.repeat(qs.length-round)+'</div>'
     +'<div class="q"><button class="spk" id="say" aria-label="再听一遍">🔊</button><span>听一听，点对的图</span></div>'
     +'<div class="opts">'+opts.map((o,i)=>'<button data-i="'+i+'" aria-label="选项 '+(i+1)+'">'+emo(o)+'</button>').join('')+'</div><div class="fb" id="fb"></div></div>';
    const say=()=>play([it.wa],$('#say'));
    $('#say').onclick=say;say();
    let locked=false,tries=0;
    el.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
      if(locked)return;const o=opts[+b.dataset.i];
      if(o===it){
        locked=true;if(!tries)score++;b.classList.add('ok');
        $('#fb').innerHTML='<span class="ok" lang="de">Richtig!</span> 对了！<b lang="de">'+word(it)+'</b> = '+esc(it.zh)+'<div class="py">谐音：'+esc(it.py)+'</div>';
        play([it.wa]).then(()=>setTimeout(()=>{round++;ask();},700));
      }else{
        tries++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');
        $('#fb').innerHTML='<span class="bad" lang="de">Noch einmal!</span> 再听一遍试试～这个是 '+esc(o.zh);
        say();
      }
    });
  };
  ask();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function route(){
  const [id,tab]=decodeURIComponent(location.hash.slice(1)).split('/');
  if(id)theme(id,tab);else home();
  scrollTo(0,0);
}
addEventListener('hashchange',route);
try{const th=localStorage.getItem('theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;}catch(e){}
route();
</script>
