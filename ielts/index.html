<style>
:root{
  --bg:#f6f1e7;--surface:#fffdf8;--surface-2:#faf5ec;--text:#1a2035;--dim:#434b65;--faint:#5f6374;--border:rgba(26,32,53,.12);
  --accent:#b5492e;--accent-text:#983b24;--on-accent:#fffdf8;--ok:#3a5c34;--shadow:0 1px 2px rgba(30,38,64,.05),0 18px 40px -24px rgba(30,38,64,.28);
}
:root[data-theme=dark]{
  --bg:#0d1120;--surface:#131a2b;--surface-2:#19213a;--text:#f2ebdd;--dim:#c8c1b3;--faint:#9c9aa2;--border:rgba(242,235,221,.12);
  --accent:#e57c5a;--accent-text:#f29a7b;--on-accent:#1a1206;--ok:#b5d1ac;--shadow:0 20px 40px -24px rgba(0,0,0,.7);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1120;--surface:#131a2b;--surface-2:#19213a;--text:#f2ebdd;--dim:#c8c1b3;--faint:#9c9aa2;--border:rgba(242,235,221,.12);
  --accent:#e57c5a;--accent-text:#f29a7b;--on-accent:#1a1206;--ok:#b5d1ac;--shadow:0 20px 40px -24px rgba(0,0,0,.7);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--border);background:var(--surface);text-decoration:none;color:var(--text);font-size:14px;white-space:nowrap}
h1{flex:1;margin:0;font:700 19px/1.3 Georgia,"Songti SC","Noto Serif SC",serif;min-width:0}
h1 small{display:block;font:400 12px/1.4 -apple-system,sans-serif;color:var(--faint)}
.lv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.lv button{min-height:52px;border-radius:14px;border:1px solid var(--border);background:var(--surface);padding:4px 0;line-height:1.25}
.lv button b{display:block;font-size:15px}.lv button span{font-size:11px;color:var(--faint)}
.lv button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lv button[aria-pressed=true] span{color:inherit;opacity:.85}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;min-height:46px;border-radius:23px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:15px}
.tabs button[aria-selected=true]{border:2px solid var(--accent);color:var(--accent-text)}
.prog{font-size:13px;color:var(--dim);margin:-4px 0 12px}
.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 16px;box-shadow:var(--shadow);text-align:center}
.card .n{font-size:12px;color:var(--faint)}
.card .w{font:700 34px/1.2 Georgia,serif;margin:10px 0 2px;word-break:break-word}
.card .ipa{color:var(--dim);font-size:15px}
.card .py{color:var(--faint);font-size:13px}
.sense{font-size:17px;margin:14px 0 4px;color:var(--accent-text);font-weight:600}
.sense small{color:var(--faint);font-weight:400;margin-right:4px}
.ex{font-size:15px;color:var(--text);margin-top:10px;line-height:1.55;text-align:left}
.ex .zh{font-size:13px;color:var(--faint)}
.col{font-size:13px;color:var(--dim);text-align:left;margin-top:8px}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:50px;border-radius:25px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:15px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.spk{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);font-size:18px;vertical-align:middle;margin-left:6px}
.done{font-size:16px;color:var(--ok);font-weight:600;padding:10px 0}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input,.tools select{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 12px;color:var(--text);font-size:15px}
.tools select{flex:0 0 38%}
.row{display:flex;gap:8px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.row .t{flex:1;min-width:0}
.row b{font-size:16px}.row .ipa{font-size:12px;color:var(--faint);margin-left:6px}
.row .z{font-size:14px;color:var(--dim)}
.row .k{font-size:12px;color:var(--ok);white-space:nowrap;padding-top:3px}
.row .more{display:none;font-size:14px;color:var(--text);margin-top:6px}
.row.open .more{display:block}
.loadmore{width:100%;margin-top:12px}
.foot{margin-top:28px;font-size:12px;color:var(--faint);line-height:1.8;border-top:1px solid var(--border);padding-top:12px}
.empty{text-align:center;color:var(--faint);padding:30px 0}

<body>
<div class="wrap" id="app">
  <div class="top"><a class="back" href="/">← 手册</a><h1>🇬🇧 雅思词汇<small>7298 词 · A1–C2 分级 · 音标 · 中文 · 例句</small></h1></div>
  <div class="lv" id="lv" role="group" aria-label="选择级别"></div>
  <div class="prog" id="prog"></div>
  <div class="tabs" role="tablist"><button role="tab" id="tLearn" onclick="setTab('learn')">📅 今日背词</button><button role="tab" id="tList" onclick="setTab('list')">📚 词表</button></div>
  <div id="pane"><div class="empty">加载中…</div></div>
  <div class="foot">词库来自 <a href="https://github.com/designfuchen/word-atlas" target="_blank" rel="noopener">Word Atlas</a>（CC BY 4.0，署名 Word Atlas contributors），本站只做了分级切分和中文谐音。<br>雅思大约要 B2–C1：零基础先从 A1、A2 背起。学习进度只存在这台手机的浏览器里。</div>
</div>
<script>
var LEVELS=['A1','A2','B1','B2','C1','C2'],COUNT={A1:785,A2:1039,B1:1465,B2:2127,C1:1608,C2:274};
var TOPIC={daily:'日常',society:'社会',thinking:'思维',nature:'自然',work:'工作',health:'健康',education:'教育',emotion:'情感',science:'科学',travel:'旅行',economy:'经济',arts:'艺术',technology:'科技',government:'政府',city:'城市',environment:'环境',history:'历史',sport:'运动',media:'媒体'};
var IV=[0,1,2,4,7,15,30],NEW_PER_DAY=10;
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
try{var th=localStorage.getItem('theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;}catch(e){}

// 进度：{词: {lv:熟练级, due:下次复习时间}}；lv>=1 记为「认识」
function book(){try{return JSON.parse(lsGet('ieltsBook','{}'))||{};}catch(e){return {};}}
function saveBook(b){lsSet('ieltsBook',JSON.stringify(b));}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

var cur=LEVELS.indexOf(lsGet('ieltsLevel','A1'))>=0?lsGet('ieltsLevel','A1'):'A1';
var tab=lsGet('ieltsTab','learn')==='list'?'list':'learn';
var DATA={},queue=null,show=false,listN=60,q='',topic='';

function load(lv,cb){
  if(DATA[lv])return cb(DATA[lv]);
  fetch('data/'+lv+'.json').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){DATA[lv]=d;cb(d);})
  .catch(function(){$('#pane').innerHTML='<div class="empty">词库没下载下来，检查一下网络 <button class="btn" onclick="render()">重试</button></div>';});
}
function renderLevels(){
  var b=book(),known={};for(var w in b)if(b[w].lv>=1&&b[w].c)known[b[w].c]=(known[b[w].c]||0)+1;
  $('#lv').innerHTML=LEVELS.map(function(l){return '<button aria-pressed="'+(l===cur)+'" onclick="setLevel(\''+l+'\')"><b>'+l+'</b><span>'+(known[l]||0)+'/'+COUNT[l]+'</span></button>';}).join('');
  var k=known[cur]||0;
  $('#prog').innerHTML=cur+' 级已认识 '+k+' / '+COUNT[cur]+' 词<div class="bar"><i style="width:'+(k/COUNT[cur]*100).toFixed(1)+'%"></i></div>';
}
function setLevel(l){cur=l;lsSet('ieltsLevel',l);queue=null;show=false;listN=60;render();}
function setTab(t){tab=t;lsSet('ieltsTab',t);show=false;render();}
function speak(w){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
function senses(r){return r[2].map(function(s){return '<div><small>'+esc(s[0])+'</small>'+esc(s[1])+'</div>';}).join('');}

// 今日队列：先复习到期的，再补 NEW_PER_DAY 个新词（每天的新词额度按级别记）
function buildQueue(d){
  var b=book(),now=Date.now(),due=[],fresh=[];
  var quota=JSON.parse(lsGet('ieltsNew','{}')||'{}');var key=today()+'|'+cur;var used=quota[key]||0;
  d.forEach(function(r,i){var x=b[r[0]];if(x){if(x.due<=now&&x.lv<IV.length-1)due.push(i);}else fresh.push(i);});
  return {due:due,fresh:fresh.slice(0,Math.max(0,NEW_PER_DAY-used)),again:[],key:key};
}
function render(){
  renderLevels();
  $('#tLearn').setAttribute('aria-selected',tab==='learn');$('#tList').setAttribute('aria-selected',tab==='list');
  load(cur,function(d){tab==='learn'?learn(d):list(d);});
}
function learn(d){
  if(!queue)queue=buildQueue(d);
  var el=$('#pane'),kind=queue.due.length?'due':queue.fresh.length?'fresh':'again',idx=queue[kind][0];
  if(idx==null){el.innerHTML='<div class="card"><div class="done">✅ 今天 '+cur+' 级的词背完了</div><div class="n">明天再来，到期的词会自动出现。想多背，可以换一级或去「词表」翻翻。</div><div class="btns"><button class="btn" onclick="moreNew()">再来 10 个新词</button></div></div>';return;}
  var r=d[idx],isNew=kind==='fresh';
  el.innerHTML='<div class="card"><div class="n">'+(isNew?'新词':kind==='again'?'再认一次':'复习')+' · 还剩 '+(queue.due.length+queue.fresh.length+queue.again.length)+' 个 · '+esc(TOPIC[r[5]]||r[5])+'</div>'
   +'<div class="w" lang="en">'+esc(r[0])+'<button class="spk" aria-label="朗读 '+esc(r[0])+'" onclick="speak(\''+esc(r[0]).replace(/'/g,"\\'")+'\')">🔊</button></div>'
   +'<div class="ipa">'+esc(r[1])+'</div>'+(r[6]?'<div class="py">谐音：'+esc(r[6])+'</div>':'')
   +(show?'<div class="sense">'+senses(r)+'</div>'
      +(r[3]?'<div class="ex" lang="en">'+esc(r[3])+'<div class="zh">'+esc(r[4])+'</div></div>':'')
      +(r[7].length?'<div class="col">搭配：'+r[7].map(esc).join('　')+'</div>':'')
      +'<div class="btns"><button class="btn" onclick="grade(0)">😕 不认识</button><button class="btn main" onclick="grade(1)">😊 认识</button></div>'
    :'<div class="btns"><button class="btn main" onclick="show=true;learn(DATA[cur])">👀 想一想，再看意思</button></div>')+'</div>';
  if(!show)speak(r[0]);
}
function grade(ok){
  var d=DATA[cur],kind=queue.due.length?'due':queue.fresh.length?'fresh':'again',isNew=kind==='fresh',idx=queue[kind].shift(),r=d[idx],b=book(),x=b[r[0]]||{lv:0,c:cur};
  if(isNew){var quota={};try{quota=JSON.parse(lsGet('ieltsNew','{}'))||{};}catch(e){}quota[queue.key]=(quota[queue.key]||0)+1;for(var k in quota)if(k.split('|')[0]!==today())delete quota[k];lsSet('ieltsNew',JSON.stringify(quota));}
  if(ok){x.lv=Math.min(IV.length-1,(x.lv||0)+1);x.due=Date.now()+IV[x.lv]*864e5-36e5;}
  else{x.lv=0;x.due=Date.now();queue.again.push(idx);}   // 不认识：本轮最后再来一次
  x.c=cur;b[r[0]]=x;saveBook(b);show=false;renderLevels();learn(d);
}
function moreNew(){var quota={};try{quota=JSON.parse(lsGet('ieltsNew','{}'))||{};}catch(e){}quota[today()+'|'+cur]=Math.max(0,(quota[today()+'|'+cur]||0)-NEW_PER_DAY);lsSet('ieltsNew',JSON.stringify(quota));queue=null;learn(DATA[cur]);}
function list(d){
  var el=$('#pane'),b=book();
  var topics=Object.keys(TOPIC).filter(function(t){return d.some(function(r){return r[5]===t;});});
  var rows=d.filter(function(r){return (!topic||r[5]===topic)&&(!q||r[0].toLowerCase().indexOf(q)>=0||r[2].some(function(s){return s[1].indexOf(q)>=0;}));});
  el.innerHTML='<div class="tools"><input id="q" type="search" placeholder="搜英文或中文" value="'+esc(q)+'" aria-label="搜索单词"><select id="tp" aria-label="按话题筛选"><option value="">全部话题</option>'+topics.map(function(t){return '<option value="'+t+'"'+(t===topic?' selected':'')+'>'+TOPIC[t]+'</option>';}).join('')+'</select></div>'
   +'<div class="n" style="font-size:12px;color:var(--faint)">共 '+rows.length+' 词，点一行看例句</div>'
   +(rows.length?rows.slice(0,listN).map(function(r){var x=b[r[0]];return '<div class="row" data-w="'+esc(r[0])+'"><div class="t"><b lang="en">'+esc(r[0])+'</b><span class="ipa">'+esc(r[1])+'</span><div class="z">'+esc(r[2].map(function(s){return s[0]+' '+s[1];}).join('；'))+'</div>'
      +'<div class="more">'+(r[6]?'<div class="py" style="font-size:12px;color:var(--faint)">谐音：'+esc(r[6])+'</div>':'')+(r[3]?'<div lang="en">'+esc(r[3])+'</div><div class="z">'+esc(r[4])+'</div>':'')+(r[7].length?'<div class="z">搭配：'+r[7].map(esc).join('　')+'</div>':'')+'</div></div>'
      +'<span class="k">'+(x&&x.lv>=1?'✓ 认识':'')+'</span><button class="spk" aria-label="朗读 '+esc(r[0])+'">🔊</button></div>';}).join(''):'<div class="empty">没找到</div>')
   +(rows.length>listN?'<button class="btn loadmore" id="lm">再显示 60 个（还有 '+(rows.length-listN)+'）</button>':'');
  var qi=$('#q');qi.oninput=function(){q=qi.value.trim().toLowerCase();listN=60;var pos=qi.selectionStart;list(d);var n=$('#q');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
  $('#tp').onchange=function(){topic=this.value;listN=60;list(d);};
  var lm=$('#lm');if(lm)lm.onclick=function(){listN+=60;var y=scrollY;list(d);scrollTo(0,y);};
  el.querySelectorAll('.row').forEach(function(row){row.onclick=function(e){if(e.target.closest('.spk')){speak(row.dataset.w);return;}row.classList.toggle('open');};});
}
render();
</script>
</body>
</html>
