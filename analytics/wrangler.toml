name = "uuoo-analytics"
main = "worker.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "uuoo_analytics"
database_id = "b042a9df-2b10-4ef3-8c4e-e638ecddeffe"

[vars]
# 查看统计的密钥（GET /stats?key=... 用）是敏感值，不能写入仓库。
# 首次部署或轮换时运行：wrangler secret put STATS_KEY
# STATS_KEY = "<set-with-wrangler-secret>"
# 站点地址（GitHub 登录成功后跳回这里）
SITE_URL = "https://www.uuoo.site"
# GitHub OAuth App 的 Client ID（公开值，可放这里）；Secret 用 `wrangler secret put GH_CLIENT_SECRET`
GH_CLIENT_ID = "Ov23liyrQtw2yZr6DeYg"
# Google OAuth Client ID（公开值）；Secret 用 `wrangler secret put GOOGLE_CLIENT_SECRET`
GOOGLE_CLIENT_ID = ""
# 爱发电开发者 user_id（公开值）；API Token 是密钥：在 Cloudflare 后台 uuoo-analytics → 设置 → 变量和机密 → 添加「密钥」AFDIAN_TOKEN
# （或 wrangler secret put AFDIAN_TOKEN）。爱发电后台 Webhook URL 填 https://uuoo-analytics.uuoo.workers.dev/api/afdian/webhook
AFDIAN_USER_ID = "6abc65a2dd4b11f19d3d52540025c377"

# 定时清理：每天凌晨 4 点删过期埋点（保留 90 天）与过期会话/state/频控计数。
# 不配这个，events 表会一直涨到 D1 的 10GB 上限。
[triggers]
crons = ["0 4 * * *"]
