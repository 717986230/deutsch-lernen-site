# 构建并校验 Vue 用户端。GitHub Pages 从 main 根目录自动发布。
name: Validate web

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:        # 支持手动触发，便于紧急重发

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build          # 同时生成 sw.js（gen-sw.mjs）
        working-directory: web
      # 确认构建产物已提交，避免 GitHub Pages 发布旧文件
      - run: git diff --exit-code -- index.html sw.js assets data
      # 内容数据体检：谐音字符集、字段完整性、同词一致性
      - run: npm ci --ignore-scripts && npm run verify:data
