# 只校验 web/（Vue 新端）能否构建。⚠️ Vue 新端【没有上线】：线上 www.uuoo.site 是 src.html 的构建产物，
# 它由「主站体检」(verify-site.yml) 把关。这里绿灯不代表线上没问题。
name: Vue 新端构建（未上线）

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:        # 支持手动触发，便于紧急重发

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build          # 同时生成 sw.js（gen-sw.mjs）
        working-directory: web
