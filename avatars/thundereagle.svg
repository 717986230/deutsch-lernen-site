<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><defs><radialGradient id="b" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#0f0520"/></radialGradient><linearGradient id="fe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#b45309"/></linearGradient><style>.bl{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
