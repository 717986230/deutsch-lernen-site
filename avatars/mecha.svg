<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><defs><radialGradient id="b" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#0b1220"/></radialGradient><linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient><style>.bl{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
